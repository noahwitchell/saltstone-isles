<title>Saltstone Isles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: full-bleed pixel render; flight data along the top edge, throttle under the left thumb, stick zone under the right thumb; paper-card overlays for menus. One committed dusk-arcade look. */
:root{
  --ink:#241c2e; --ink2:#4a3d55; --paper:#f5e8cf; --paper2:#e3cda4; --accent:#e2703f; --accent2:#b5512b;
  --good:#5c9e4f; --warn:#f1c84a; --bad:#e5483b; --glass:rgba(36,28,46,.74); --line:#5a4a63;
  --display:'Pixelify Sans','VT323',ui-monospace,monospace; --fancy:'Jacquarda Bastarda 9','Pixelify Sans',serif; --mono:'VT323',ui-monospace,monospace;
  --sl:max(10px, env(safe-area-inset-left, 0px)); --sr:max(10px, env(safe-area-inset-right, 0px));
  --st:calc(6px + env(safe-area-inset-top, 0px)); --sb:calc(8px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
[hidden]{display:none!important}
/* turned 90 degrees when the phone is upright, so the game is always landscape. Safe-area insets swap sides to match */
html.rot body{position:fixed;left:0;top:0;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
html.rot{--sl:max(10px, env(safe-area-inset-top, 0px));--sr:max(10px, env(safe-area-inset-bottom, 0px));--st:calc(6px + env(safe-area-inset-right, 0px));--sb:calc(8px + env(safe-area-inset-left, 0px))}
html,body{height:100%;margin:0;background:#1f1a2b;color:var(--paper);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--display)}
#gl,#hud{position:fixed;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated}
#hud{pointer-events:none}
button{font:inherit;color:var(--ink);background:var(--paper);border:0;border-radius:0;padding:8px 12px;cursor:pointer;touch-action:manipulation;
  box-shadow:inset -3px -3px 0 var(--paper2), 0 3px 0 #0007}
button:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 var(--paper2), 0 1px 0 #0007}
button.primary{background:var(--accent);color:#fff8ec;box-shadow:inset -3px -3px 0 var(--accent2), 0 3px 0 #0007}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* flight HUD */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:var(--st) var(--sr) 0 var(--sl);pointer-events:none}
.pill{pointer-events:auto;font-family:var(--mono);font-size:21px;line-height:1;background:var(--glass);color:var(--paper);padding:7px 9px;border:2px solid var(--line);
  box-shadow:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:13px;opacity:.75;margin-left:3px}
#spd.warn{background:var(--bad);border-color:#ffb0a0}
.pill.ok{background:rgba(52,110,48,.85);border-color:#8fe08a}.pill.caution{background:rgba(170,120,30,.9);border-color:#f1c84a}
#vsi.ok{color:#8fe08a}#vsi.caution{color:#f1c84a}#vsi.bad{color:#ff8a7a}
#callout{z-index:5;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:42px;color:var(--paper);text-shadow:3px 3px 0 var(--ink);pointer-events:none}
#vsi{font-size:15px;margin-left:6px;opacity:.9}
#dest{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:8px 10px;color:var(--paper);background:var(--glass);border:2px solid var(--line);box-shadow:none}
#dest .arr{display:inline-block;width:12px;text-align:center;color:#6fe0e0;margin-right:4px}
.sp{flex:1;display:flex;justify-content:center;min-width:0}
#task{pointer-events:auto;font-family:var(--mono);font-size:15px;line-height:1;padding:5px 9px;background:var(--glass);border:2px solid var(--line);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;gap:6px;align-items:center}
#task img{width:14px;height:14px;image-rendering:pixelated;flex:none}
#task b{color:#ffd36b}#task .dim{opacity:.7}
#todBtn,#radioBtn{pointer-events:auto;padding:3px 5px;line-height:0}#todBtn img,#radioBtn img{width:32px;height:32px;image-rendering:pixelated;display:block}
#view,#pause,#center{pointer-events:auto;font-family:var(--mono);font-size:15px;padding:8px 10px}
#stallBan{z-index:5;position:fixed;left:50%;top:calc(var(--st) + 44px);transform:translateX(-50%);font-family:var(--mono);font-size:20px;background:var(--bad);color:#fff;padding:5px 12px;letter-spacing:.1em;pointer-events:none}
#toast{z-index:26;white-space:pre-line;position:fixed;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);max-width:min(520px,52vw);background:var(--paper) var(--paperTex);background-size:640px 640px;box-shadow:inset 0 0 6px rgba(100,52,12,.52),inset 0 0 20px rgba(120,70,22,.36),inset 0 0 44px rgba(140,92,38,.18);color:var(--ink);padding:9px 13px;font-size:15px;line-height:1.3;
  box-shadow:4px 4px 0 #0008;pointer-events:none;text-align:center;text-wrap:balance}


/* controls: an analog panel. Throttle quadrant lever on the left, a rail of little toggle buttons beside it, and
   panels (map, today's jobs, landing controls, air drop) that fold away so you can just look at the view */
#thr{position:fixed;left:var(--sl);top:calc(var(--st) + 50px);bottom:calc(var(--sb) + 106px);width:58px;touch-action:none;z-index:2;
  background:linear-gradient(90deg,#3b3542,#2c2733 45%,#24202b);border:2px solid #15121a;box-shadow:inset 2px 2px 0 #4d4656,inset -2px -2px 0 #1a161f}
#thr .lab{position:absolute;left:0;right:0;top:4px;text-align:center;font:9px/1 var(--mono);letter-spacing:.08em;color:#cfc4b2}
#thrSlot{position:absolute;left:50%;top:22px;bottom:36px;width:8px;margin-left:-4px;background:#0d0b10;box-shadow:inset 2px 0 0 #000,1px 0 0 #4d4656}
#thrTicks{position:absolute;right:4px;top:22px;bottom:36px;width:6px;background:repeating-linear-gradient(#cfc4b2 0 1px,transparent 1px 10%)}
#thrKnob{position:absolute;left:3px;right:3px;height:24px;bottom:calc(36px + var(--t,0) * (100% - 58px));transform:translateY(50%);border-radius:7px 7px 4px 4px;
  background:linear-gradient(#55505c,#18151c 40%,#0b090d);box-shadow:inset 0 2px 0 #8a8492,0 3px 0 #000a;pointer-events:none}
#thrKnob::after{content:'';position:absolute;left:6px;right:6px;top:9px;height:2px;background:#e2703f}
#thrPct{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);font-size:14px;color:#ffd36b}
#rail{position:fixed;left:calc(var(--sl) + 64px);top:calc(var(--st) + 50px);display:flex;flex-direction:column;gap:4px;z-index:2}
.rb{width:34px;height:34px;padding:2px;line-height:0;background:rgba(28,24,34,.55);box-shadow:inset 0 0 0 1px #4d4656,0 2px 0 #0006;opacity:.6}
.rb img{filter:grayscale(1) brightness(.75)}
.rb img{width:30px;height:30px;image-rendering:pixelated}
/* a panel that is showing: bright cream button, full-color icon, gold edge and a little lit dot */
.rb.on{background:#fff4dc;opacity:1;box-shadow:inset 0 0 0 2px #ffd36b,0 0 8px #ffd36b88,0 2px 0 #0008}.rb.on img{filter:none}
.rb{position:relative}.rb.on::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;background:#5fd35a;box-shadow:0 0 4px #8fe08a}
.rb.nudge{animation:nudge 1s infinite}@keyframes nudge{50%{background:#e2703f;opacity:1}}
#wind{position:fixed;left:var(--sl);bottom:var(--sb);z-index:2;width:58px;height:48px;padding:0;font-family:var(--mono);font-size:10px;line-height:1;color:var(--ink);background:linear-gradient(to top,#ffd36b var(--w,0%),#fff0c4 var(--w,0%));box-shadow:inset -2px -2px 0 #b8902e, 0 2px 0 #0007;pointer-events:auto}
#updraft{position:fixed;left:var(--sl);bottom:calc(var(--sb) + 53px);z-index:2;width:58px;height:48px;padding:0;font-family:var(--mono);font-size:10px;line-height:1;color:var(--ink);background:linear-gradient(to top,#a8dcf4 var(--w,0%),#e4f4fc var(--w,0%));box-shadow:inset -2px -2px 0 #4a8ab0, 0 2px 0 #0007;pointer-events:auto}
#updraft img{width:28px;height:28px;image-rendering:pixelated;display:block;margin:2px auto 1px}#updraft span{display:block;font-size:10px;color:#2a6a9a}#updraft.on{background:#a8dcf4}#updraft.off{opacity:.55}
#wind img{width:28px;height:28px;image-rendering:pixelated;display:block;margin:2px auto 1px}
#wind span{display:block;font-size:10px;color:#a0601e}
#wind.on{background:#ffd36b}
#wind.off{opacity:.55}
#wind.cool{background:linear-gradient(to top,#c9a85a var(--w,0%),#6a5a48 var(--w,0%));color:var(--paper)}
#wind.cool span{color:var(--paper)}
#pcol{position:fixed;left:calc(var(--sl) + 106px);top:calc(var(--st) + 50px);width:124px;display:flex;flex-direction:column;gap:6px;z-index:2}
#mapc{width:124px;height:124px;image-rendering:pixelated;border:2px solid var(--line);background:#1d2a44;display:block;box-sizing:border-box;cursor:pointer}
#job{background:var(--glass);border:2px solid #b8902e;padding:3px 5px 4px;font-family:var(--mono);font-size:13px;line-height:1.15;color:#ffd890;cursor:pointer;pointer-events:auto;width:150px;box-sizing:border-box}
#job .jh{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--paper);opacity:.85;letter-spacing:.04em}
#score{color:#ffd36b}#score.pop{animation:pop .5s}@keyframes pop{30%{transform:scale(1.15);color:#fff}}
#jDrop.done{color:#8fe08a}#jDrop{color:#ff9a6a}
/* landing controls: small separate switches along the bottom, brake right next to the throttle */
#eng{position:fixed;left:calc(var(--sl) + 64px);bottom:var(--sb);display:flex;gap:5px;align-items:flex-end;z-index:2}
.tsw,#brake,#flapL,#micBtn,#hornBtn{position:relative;width:40px;height:58px;padding:0;border-radius:7px;background:rgba(28,24,34,.78);
  box-shadow:inset 0 0 0 1px #5a5266,inset 0 2px 0 #ffffff14,0 2px 0 #0009;touch-action:manipulation}
.tsw:active,#brake:active,#micBtn:active,#hornBtn:active{transform:none}
#hornBtn .bell{position:absolute;left:50%;top:32px;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff2b0,#e0a83a 45%,#8a5a18);box-shadow:0 0 0 1.5px #3a2a10,0 3px 0 #000a}
#hornBtn:active .bell,#hornBtn.honk .bell{transform:translateY(2px);box-shadow:0 0 0 1.5px #3a2a10,0 1px 0 #000a;filter:brightness(1.2)}
.lab{position:absolute;left:-3px;right:-3px;top:4px;text-align:center;font:8px/1 var(--mono);letter-spacing:.02em;color:#d8cebe;white-space:nowrap;pointer-events:none}
.tsw .nut{position:absolute;left:50%;top:34px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0eef4,#9a96a2 55%,#55515c);box-shadow:0 0 0 1.5px #15121a}
.tsw .bat{position:absolute;left:50%;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(90deg,#8c8896,#f4f2f8 45%,#a4a0ac);box-shadow:0 0 0 1px #15121a;transition:top .07s,height .07s}
.tsw.on .bat{top:16px;height:18px}.tsw:not(.on) .bat{top:34px;height:15px;filter:brightness(.8)}
.tsw em{position:absolute;left:0;right:0;bottom:3px;font:normal 8px/1 var(--mono);text-align:center;color:#a49cae;pointer-events:none}
.tsw em.u{display:none}.tsw.on em.u{display:block;color:#8fe08a}.tsw.on em.d{display:none}
.tsw.warn{animation:warnb .6s infinite}@keyframes warnb{50%{background:#7a5c18}}
#flapL{width:42px;cursor:ns-resize;touch-action:none}
#flapL .fslot{position:absolute;left:11px;top:16px;bottom:8px;width:4px;background:#0d0b10}
#flapL .fd{position:absolute;right:5px;font:9px/1 var(--mono);color:#7b7385;transform:translateY(-50%);pointer-events:none}
#flapL .fd.on{color:#ffd36b}
#flapH{position:absolute;left:3px;width:20px;height:9px;transform:translateY(-50%);transition:top .12s;pointer-events:none;
  background:linear-gradient(#ffffff,#d8d2c8);clip-path:polygon(0 30%,20% 0,100% 35%,100% 65%,20% 100%,0 70%);filter:drop-shadow(0 1px 0 #000)}
#brake{width:46px;height:64px;touch-action:none;background:linear-gradient(to top, rgba(140,40,32,.9) var(--b,0%), rgba(28,24,34,.78) var(--b,0%))}
#brake .ped{position:absolute;left:8px;right:8px;top:17px;bottom:7px;border-radius:3px;background:repeating-linear-gradient(#5a5560 0 3px,#2a2630 3px 6px);box-shadow:0 0 0 1.5px #15121a}
#brake.on .ped{background:repeating-linear-gradient(#e5483b 0 3px,#8a2a22 3px 6px)}
#check{position:fixed;left:calc(var(--sl) + 240px);top:calc(var(--st) + 50px);background:var(--glass);border:2px solid var(--line);padding:6px 9px;font-family:var(--mono);font-size:14px;line-height:1.6;pointer-events:none;z-index:2}
#check b{display:block;font-size:9px;opacity:.75;letter-spacing:.06em}
@media (max-height:520px){#pcol{flex-direction:row;align-items:flex-start;width:auto}#check{left:calc(var(--sl) + 116px);top:calc(var(--st) + 186px);font-size:12px;line-height:1.45;padding:4px 7px}}
#check .ok{color:#8fe08a}
#fps{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 46px);white-space:nowrap;background:var(--glass);color:var(--paper);font-family:var(--mono);font-size:13px;padding:3px 6px;pointer-events:none;z-index:1}
/* accessories: a column of small switches down the right edge, with the air-drop buttons beside it when needed */
#rcol{position:fixed;right:var(--sr);top:calc(var(--st) + 50px);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:6px;z-index:3}
#fun{display:flex;flex-direction:column;gap:5px}
.tsw.red .bat{background:linear-gradient(90deg,#8a1e18,#ff6a5a 45%,#a4281f)}.tsw.red.on em.u{color:#ff9a6a}
#micBtn .grille{position:absolute;left:9px;right:9px;top:15px;height:26px;border-radius:5px;background:repeating-radial-gradient(circle at 50% 50%,#55505c 0 1.2px,#141118 1.2px 3px);box-shadow:0 0 0 1.5px #0b090d,0 2px 0 #000}
#micBtn:active .grille{transform:translateY(2px);box-shadow:0 0 0 1.5px #0b090d}
#micBtn.talk{animation:talkb .5s infinite}@keyframes talkb{50%{background:rgba(70,110,60,.9)}}
#micBtn em{position:absolute;left:0;right:0;bottom:3px;font:normal 8px/1 var(--mono);color:#ffd36b;text-align:center}
#dropUI{display:flex;flex-direction:column;gap:6px}
#dropUI button{font-family:var(--mono);font-size:14px;line-height:1.1;padding:8px 10px;min-width:62px}
#lookBtn.on{background:var(--good);color:#fff;box-shadow:inset -3px -3px 0 #3e7334, 0 3px 0 #0007}
#dropBtn{background:#e2703f;color:#fff8ec;box-shadow:inset -3px -3px 0 #b5512b, 0 3px 0 #0007}#dropBtn.empty{opacity:.55}
#stick{position:fixed;left:42%;right:0;top:calc(var(--st) + 50px);bottom:0;touch-action:none}
#ring{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border:2px dashed #f5e8cf99;border-radius:50%;pointer-events:none}
#ring.idle{opacity:.55}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;background:var(--paper);border-radius:50%;box-shadow:0 3px 0 #0008}
#ringHint{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--paper);opacity:.8}

/* overlays */
#chartOv{position:fixed;inset:0;z-index:28;background:#1e4878;border:3px solid #fff8ec;box-sizing:border-box}
#chartOv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#chartLeg{position:absolute;left:calc(var(--sl) + 4px);top:calc(var(--st) + 2px);font-family:var(--mono);font-size:12px;line-height:1.15;color:var(--paper);background:rgba(20,34,58,.6);padding:3px 6px;max-width:42%;pointer-events:none}
#chartLeg b{color:#ffd36b;letter-spacing:.06em}
#chartLeg{animation:legfade .8s 4s forwards}@keyframes legfade{to{opacity:0}}
#chartX{position:absolute;right:calc(var(--sr) + 2px);top:calc(var(--st) + 2px);width:36px;height:36px;padding:0;font-size:18px;line-height:1;background:var(--paper);color:var(--ink)}
.who{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.who img{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--ink);flex:none}
.px-img{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.who b{display:block;font-size:22px;line-height:1.05;font-weight:700}
.who span{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:.05em}
.say{font-size:18px!important;line-height:1.35}
.got{font-family:var(--mono);font-size:15px;color:var(--ink2);margin:6px 0 4px}
.page h4{font-family:var(--mono);font-size:15px;letter-spacing:.06em;color:var(--ink2);margin:10px 0 4px}
.page ul{margin:0 0 10px;padding-left:20px;font-size:15px;line-height:1.4}
.page table{border-collapse:collapse;font-size:14px;margin:4px 0 12px;width:100%}
.page td{color:var(--ink);border-top:2px dashed var(--paper2);padding:6px 6px 6px 0;vertical-align:top}
.page td:first-child{font-family:var(--mono);font-size:15px;white-space:nowrap;color:var(--ink2)}
#bigmap{width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--ink);display:block;margin:4px 0 10px;background:#1d2a44}
.card.wide{width:min(760px,100%)}
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) var(--sr) calc(12px + env(safe-area-inset-bottom,0px)) var(--sl);background:rgba(28,22,38,.35);overflow:auto}
.card{background:var(--paper) var(--paperTex);background-size:640px 640px;image-rendering:auto;color:var(--ink);width:min(520px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-shadow:6px 6px 0 #000a,inset 0 0 8px rgba(100,52,12,.55),inset 0 0 26px rgba(120,70,22,.4),inset 0 0 70px rgba(140,92,38,.26),inset 0 0 140px rgba(150,105,45,.14);border:3px solid var(--ink);box-sizing:border-box}
.card .topbar{display:flex;gap:8px;margin:-6px 0 10px;position:sticky;top:-18px;z-index:2;background:var(--paper);padding:6px 0 4px}
.card .backbtn{font-family:var(--mono);font-size:17px;padding:6px 12px}
.card h2{margin:0 0 4px;font-size:26px;line-height:1.05;font-weight:700;text-wrap:balance}
.card .sub{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--ink2);margin-bottom:12px}
.card p{margin:0 0 10px;font-size:16px;line-height:1.35}
.rows{color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:baseline;margin:6px 0 14px;font-size:16px}
.rows .k{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:.05em}
.rows .s{color:#c9842a;letter-spacing:2px;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btns button{font-size:15px}
/* card buttons are tinted so they stand out from the paper card; the orange one is the main action */
.card .btns button:not(.primary){background:var(--bc,#d6e4ec);border:2px solid #241c2e33;box-shadow:inset -3px -3px 0 #0000001f,0 3px 0 #0007}
.card .btns.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.card .btns.grid{grid-template-columns:repeat(2,1fr)}}
.card .btns.grid button{min-height:52px;font-size:16px;text-align:center;display:flex;align-items:center;justify-content:center;padding:6px 8px;color:var(--ink)}
#title{background:linear-gradient(180deg,rgba(28,22,38,.0) 30%,rgba(28,22,38,.55));place-items:end start;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#title .wrap{max-width:560px}
#title h1{margin:0;font-family:var(--fancy);font-size:54px;line-height:.9;color:var(--paper);text-shadow:4px 4px 0 var(--ink);font-weight:400}
@media (min-width:700px) and (min-height:420px){#title h1{font-size:81px}}
#title .tag{font-family:var(--mono);font-size:15px;letter-spacing:.06em;margin:8px 0 14px;text-shadow:2px 2px 0 var(--ink)}
.list{display:grid;gap:8px;margin:4px 0 12px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff6e4 var(--paperTex);background-size:640px 640px;border:2px solid var(--paper2);padding:8px 10px;text-align:left;width:100%;box-shadow:none;color:var(--ink)}
.item b{display:block;font-size:17px}
.item span.d{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.25}
.item .r{font-family:var(--mono);font-size:14px;white-space:nowrap;color:var(--ink2)}

<script>
'use strict';
const V3 = THREE.Vector3, Q = THREE.Quaternion, DEG = Math.PI/180, TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---------------- noise ---------------- */
function hash2(x,z,s){let h=Math.imul(x|0,374761393)^Math.imul(z|0,668265263)^Math.imul(s|0,1442695041);
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,z,s=1){const ix=Math.floor(x),iz=Math.floor(z);let fx=x-ix,fz=z-iz;fx=fx*fx*(3-2*fx);fz=fz*fz*(3-2*fz);

  return (a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz)*2-1;}

let rs=12345; const rnd=()=>{rs=(Math.imul(rs,1664525)+1013904223)>>>0;return rs/4294967296;};

/* ---------------- terrain ---------------- */
/* the world is a wide rectangle so the chart fills a phone held sideways: 46 km east-west, 22 km north-south */
const SIZEX=46000,SIZEZ=22000,CELL=40,CELLSX=SIZEX/CELL,CELLSZ=SIZEZ/CELL,HALFX=SIZEX/2,HALFZ=SIZEZ/2,NVX=CELLSX+1,NVZ=CELLSZ+1;
/* the Saltstone chain: Ferrow (home) with Gull Point and Tallpine across narrow channels, then three outer islands */
const ISLES={
  ferrow:{name:'Ferrow',x:-1050,z:560},
  gull:{name:'Gull Point',x:-2550,z:-260},
  tall:{name:'Tallpine',x:1000,z:-150},
  marram:{name:'Marram Cay',x:3800,z:5000,r:1150},
  kettle:{name:'Kettle Rock',x:5600,z:-3500,r:1700},
  farhold:{name:'Farhold',x:-6000,z:-4500,r:1700},
};
function isleAt(x,z){
  for(const k of OUTER){const I=ISLES[k];if((x-I.x)**2+(z-I.z)**2<(I.r+700)**2)return k;}
  const m=homeMasks(x,z);return m.gull>m.ferrow&&m.gull>m.tall?'gull':m.tall>m.ferrow?'tall':'ferrow';}
const ell=(x,z,cx,cz,rx,rz,rot)=>{const c=Math.cos(rot),s=Math.sin(rot),dx=x-cx,dz=z-cz,u=(dx*c+dz*s)/rx,v=(-dx*s+dz*c)/rz;return 1-u*u-v*v;};
function homeMasks(x,z){const n=fbm(x*.0009,z*.0009,4,3)*.32,n2=fbm(x*.0021,z*.0021,3,5)*.12;
  return {ferrow:ell(x,z,-1150,560,820,1300,-.3)+n+n2, gull:ell(x,z,-2870,-280,720,430,.1)+n*.8+n2,
    tall:Math.max(ell(x,z,1100,-300,1400,1300,.25),ell(x,z,2250,650,850,620,0)*.8)+n+n2};}
function landMask(x,z){if(x<-3900||x>3500||z<-2300||z>2300)return -2;const m=homeMasks(x,z);return Math.max(m.ferrow,m.gull,m.tall);}
function homeH(x,z){
  const m=landMask(x,z);
  if(m<0) return Math.max(-48,m*160);
  const t=smooth(0,.42,m);
  const fh=Math.exp(-(((x+1050)**2+(z-720)**2)/(680*680)));
  const hills=(fbm(x*.0015,z*.0015,4,7)*.5+.5)*55*t*(1-.8*fh);
  const dx=x-650,dz=z+380, rid=1-Math.abs(fbm(x*.0011,z*.0011,4,11));
  const mtn=540*Math.exp(-(dx*dx+dz*dz)/(2*720*720))*(.55+.6*rid)*t;
  const g=homeMasks(x,z).gull,cliff=g>0?30*smooth(.04,.2,g):0;
  return t*34+hills+mtn-fh*t*12+cliff;
}
/* Marram Cay: a low ring of sand round a shallow lagoon, with two gaps to the sea */
function marramH(x,z){const I=ISLES.marram,dx=x-I.x,dz=z-I.z,r=Math.hypot(dx,dz);if(r>1500)return -48;const a=Math.atan2(dz,dx);
  const R=640+fbm(Math.cos(a)*1.6+5,Math.sin(a)*1.6+5,3,81)*110;
  let ring=1-((r-R)/(130+90*smooth(-.4,-.9,Math.sin(a))))**2;
  ring-=1.3*Math.max(0,Math.cos(a-.35))**40+1.3*Math.max(0,Math.cos(a-2.6))**60;
  if(ring>0) return .6+ring*3.4+fbm(x*.012,z*.012,2,83)*1.1+smooth(.5,1,ring)*1.2;
  const lag=r<R?-2.6-3.2*smooth(R-120,R-420,r):-2-(r-R-150)*.11;
  return Math.max(-48,lag,ring*6-.6);}
/* Kettle Rock: a ridged volcanic cone with a steaming crater */
const KET={cr:235,depth:125};
function kettleCone(r,a){const gul=fbm(Math.cos(a)*3+r*.003,Math.sin(a)*3+r*.003,3,91),R0=1300+gul*110+130*Math.sin(2*a+1)+80*Math.sin(3*a+2),u=1-r/R0;
  if(u<0) return Math.max(-48,u*R0*.14-1.5);
  return 470*Math.pow(u,1.35)+(1-Math.abs(gul*2))*28*u-1.5;}
function kettleH(x,z){const I=ISLES.kettle,dx=x-I.x,dz=z-I.z,r=Math.hypot(dx,dz);if(r>1900)return -48;const a=Math.atan2(dz,dx);
  if(r>=KET.cr) return kettleCone(r,a);
  const hr=kettleCone(KET.cr,a);return hr-KET.depth*(1-(r/KET.cr)**2)+vnoise(x*.03,z*.03,93)*4;}
/* Farhold: rolling moorland and one tall hill, usually wrapped in fog */
function farholdH(x,z){const I=ISLES.farhold,ca=Math.cos(.45),sa=Math.sin(.45),lx=(x-I.x)*ca+(z-I.z)*sa,lz=-(x-I.x)*sa+(z-I.z)*ca;
  const m=1-(lx/1300)**2-(lz/880)**2+fbm(x*.0012,z*.0012,4,101)*.28;if(m<-1)return -48;
  if(m<0) return Math.max(-48,m*150);const t=smooth(0,.38,m);
  const hill=190*Math.exp(-(((x-I.x+420)**2+(z-I.z+420)**2)/(2*380*380)));
  return t*16+(fbm(x*.0019,z*.0019,4,103)*.5+.5)*60*t+hill*t;}
/* ---------------- the far archipelago: fourteen more islands round the Saltstone chain ----------------
   Each island has a centre, a rough radius (for lookups) and its own height function. Pinnacles and arches are
   meshes (see isleprops.js); the heightfield only gives the ground they stand on. */
const ell2=(x,z,I,rx,rz)=>{const c=Math.cos(I.rot||0),s=Math.sin(I.rot||0),dx=x-I.x,dz=z-I.z;return [(dx*c+dz*s)/rx,(-dx*s+dz*c)/rz];};
const locUV=(I,x,z)=>{const c=Math.cos(I.rot||0),s=Math.sin(I.rot||0),dx=x-I.x,dz=z-I.z;return [dx*c+dz*s,-dx*s+dz*c];};
const fromUV=(I,u,v)=>{const c=Math.cos(I.rot||0),s=Math.sin(I.rot||0);return {x:I.x+u*c-v*s,z:I.z+u*s+v*c};};
function iblob(x,z,I,rx,rz,na,seed){const [u,v]=ell2(x,z,I,rx,rz);return 1-u*u-v*v+fbm(x*.0016,z*.0016,4,seed)*na*1.5*1+fbm(x*.0045,z*.0045,3,seed+5)*na*.7+fbm(x*.011,z*.011,2,seed+9)*na*.25;}
const sea=m=>Math.max(-48,m*150-1);
const ARCH=[
  {id:'sisters',name:'Twin Sisters',x:8300,z:1250,r:900,rot:.4,h(x,z){const m=iblob(x,z,this,820,500,.22,201);if(m<0)return sea(m);const t=smooth(0,.3,m);
     return t*11+(fbm(x*.002,z*.002,4,203)*.5+.5)*26*t;}},
  {id:'puffin',name:'Puffin Rock',x:6500,z:2650,r:380,rot:.9,h(x,z){const m=iblob(x,z,this,300,200,.18,211);if(m<0)return sea(m*1.6);
     return smooth(0,.14,m)*40+fbm(x*.01,z*.01,3,213)*7*smooth(0,.3,m);}},
  {id:'cleft',name:'Cleft Isle',x:8800,z:-6300,r:1250,rot:.25,h(x,z){const m=iblob(x,z,this,1150,780,.16,221);if(m<0)return sea(m);
     const [u,v]=locUV(this,x,z),top=smooth(0,.1,m)*(150+fbm(x*.0025,z*.0025,4,223)*30)+smooth(.1,.6,m)*25;
     const c=85*Math.sin(u/310+.4)+30*Math.sin(u/130),w=48+14*Math.sin(u*.011+1),d=Math.abs(v-c);
     return lerp(-9,top,smooth(w,w+30,d));}},
  {id:'apple',name:'Applecross',x:-2300,z:6900,r:1300,rot:-.3,h(x,z){const m=iblob(x,z,this,1200,820,.25,231);if(m<0)return sea(m);const t=smooth(0,.35,m);
     return t*18+(fbm(x*.0015,z*.0015,4,233)*.5+.5)*80*t;}},
  {id:'salt',name:'The Saltpans',x:-5900,z:2950,r:1100,rot:.7,h(x,z){const m=iblob(x,z,this,1000,680,.2,241);if(m<0)return sea(m*.6);
     const pan=saltPan(x,z);return smooth(0,.2,m)*3.4+fbm(x*.01,z*.01,2,243)*.5-(pan>=0?.9:0);}},
  {id:'mirror',name:'Looking-Glass Isle',x:1400,z:8700,r:1000,rot:0,h(x,z){const m=iblob(x,z,this,900,780,.18,251);if(m<0)return sea(m);const t=smooth(0,.3,m);
     const lr=Math.hypot(x-(this.x-180),z-(this.z+40)),rim=Math.exp(-(((lr-430)/150)**2)),lake=smooth(360,250,lr+fbm(x*.006,z*.006,3,253)*60);
     return lerp(t*12+rim*70*t+(fbm(x*.003,z*.003,3,255)*.5+.5)*14*t,-3.5,lake);}},
  {id:'mesa',name:'Starwatch Mesa',x:-9000,z:-700,r:1000,rot:.3,h(x,z){const m=iblob(x,z,this,900,700,.14,261);if(m<-.6)return -48;if(m<0)return sea(m);
     return smooth(.05,.13,m)*235+smooth(0,.05,m)*22+fbm(x*.004,z*.004,3,263)*6+smooth(.13,.5,m)*8;}},
  {id:'cascade',name:'Cascade Isle',x:2600,z:-7700,r:1100,rot:-.2,h(x,z){const m=iblob(x,z,this,980,760,.2,271);if(m<0)return sea(m);const t=smooth(0,.3,m);
     const [u,v]=locUV(this,x,z),hi=smooth(-150,0,u)*smooth(.08,.25,m),gul=Math.exp(-(((v-60-u*.08)/70)**2))*smooth(-120,350,u);
     return t*20+(fbm(x*.002,z*.002,4,273)*.5+.5)*30*t+hi*(270+fbm(x*.003,z*.003,3,275)*40)-gul*hi*60;}},
  {id:'lantern',name:'Lantern Key',x:6300,z:7700,r:900,rot:.9,h(x,z){const m=iblob(x,z,this,800,430,.2,281);if(m<0)return sea(m*1.3);const t=smooth(0,.4,m);
     return t*5+(fbm(x*.003,z*.003,3,283)*.5+.5)*10*t;}},
  {id:'quarry',name:'Greystone',x:-3800,z:-8300,r:950,rot:.1,h(x,z){const m=iblob(x,z,this,860,700,.2,291);if(m<0)return sea(m);const t=smooth(0,.3,m);
     const [u,v]=locUV(this,x,z),base=t*24+130*Math.exp(-((u+60)**2+(v-60)**2)/(2*330*330))*t+(fbm(x*.003,z*.003,3,293)*.5+.5)*20*t;
     const pr=Math.hypot(u-120,v+40)/260;if(pr>1)return base;const step=26+Math.floor(pr*7)*12+smooth(0,.25,(pr*7)%1)*12*0;return Math.min(base,lerp(step,base,smooth(.85,1,pr)));}},
  {id:'windward',name:'Windward',x:-8300,z:7300,r:1350,rot:-.5,h(x,z){const m=iblob(x,z,this,1300,440,.16,301);if(m<0)return sea(m);const t=smooth(0,.25,m);
     const [u,v]=locUV(this,x,z);return t*14+150*Math.exp(-(((v+70)/150)**2))*t*smooth(-1250,-700,u)*smooth(1250,700,u)+(fbm(x*.003,z*.003,3,303)*.5+.5)*14*t;}},
  {id:'bell',name:'Bell Rock',x:-1700,z:-5300,r:260,rot:0,h(x,z){const m=iblob(x,z,this,150,120,.15,311);if(m<0)return sea(m*2.5);return smooth(0,.25,m)*30+fbm(x*.02,z*.02,2,313)*3;}},
  {id:'tern',name:'Tern Bars',x:9300,z:5300,r:950,rot:.3,h(x,z){let best=-16;for(const [du,dv,rx,rz] of TERN){const o={x:this.x+du,z:this.z+dv,rot:this.rot+du*.0007};const m=iblob(x,z,o,rx,rz,.3,321+du);best=Math.max(best,m*4);}
     return best<0?Math.max(-48,best*3-1.2):best*.35+.3;}},
  {id:'heart',name:'Sweetheart Islet',x:-500,z:4300,r:360,rot:0,h(x,z){const u=(x-this.x)/270,v=-(z-this.z)/270+.25,f=(u*u+v*v-1)**3-u*u*v*v*v;
     const m=-f*1.2+fbm(x*.01,z*.01,2,331)*.12;if(m<0)return Math.max(-48,m*40-1.2);return smooth(0,.15,m)*6+fbm(x*.02,z*.02,2,333)*1.2;}},
];

/* Saltpans: a grid of shallow pans, each a different color; returns the pan index or -1 on the bunds */
function saltPan(x,z){const I={x:-5900,z:2950,rot:.7},[u,v]=locUV(I,x,z),gu=u/170,gv=v/130,fu=gu-Math.floor(gu),fv=gv-Math.floor(gv);
  if(fu<.08||fv<.1||Math.abs(u)>760||Math.abs(v)>420)return -1;return (hash2(Math.floor(gu),Math.floor(gv),241)*6)|0;}

  {id:'sisters',name:'Sisters Shelf',isle:'sisters',du:-220,dv:-60,hdg:0,len:440,wid:16,surf:'grass'},
  {id:'cleft',name:'Cleft Top',isle:'cleft',du:-20,dv:-430,hdg:0,len:420,wid:16,surf:'dirt'},

/* ---------- landing grades + deliveries ---------- */

    <span class="k">CENTERLINE</span><span>${off<.2?'Right down the middle':off<.5?'A little off center':'Way off center'}</span><span class="s">${stars(cen)}</span>

function deliverAt(s){

  enqueue(here);

    if(!q){mail.bag=mail.bag.filter(it=>CHARS[it.to].home!==s.id);
      const day=DAYS[mail.day-1],local=[];for(const it of here){const out=(day&&day.out&&day.out[it.to])||[];for(const o of out){if(given.has(o.item)||mail.bag.some(b=>b.item===o.item))continue;

        if(CHARS[o.to].home===s.id){given.add(o.item);local.push({...o,from:it.to});}else{mail.bag.push({...o,from:it.to});pick.push(o);}}}

      const nxt=mail.bag.length?`Next stop: <b>${dest.name}</b>.`:homeDone?'That\'s everything. Mabel is waiting to close the day.':'The bag is empty. Head home to Harbor Field.';
      showCard(`<h2>Mail delivered</h2><div class="sub">${log.stamps} STAMPS ON YOUR ROUTE CARD</div>${pick.length?`<p>Picked up: ${pick.map(o=>`<b>${o.item}</b> for ${CHARS[o.to].name.split(' ')[0]}`).join(', ')}.</p>`:''}<p>${nxt}</p>`,

      showCard(`<div class="who"><img src="${portrait(q.who)}" alt=""><div><b>${c.name}</b><span>${c.role}</span></div></div><p class="say">“${MEET[q.who]}”</p>`,[['Nice to meet you',step,true]]);return;}

function offerDay(after){

/* ---------- tips & toast ---------- */
let toastT=0;
const petSay=s=>typeof petName==='function'&&petName()!=='Biscuit'?String(s).replace(/Biscuit/g,petName()):s;

const tipQ=[];

function runTips(dt){if(!tipQ.length||toastT>0.5)return;const q=tipQ[0];q.delay-=dt;if(q.delay>0)return;tipQ.shift();log.tips[q.id]=1;saveL();toast(q.text,6.5);}

/* ---------- glide guidance ---------- */

}
const PAPI_T=[4.8,4.3,3.7,3.2];
function updPAPI(){for(const P of PAPIS){const s=P.s,l=toLocal(s,ac.pos.x,ac.pos.z),aimS=-P.dir*(s.len/2-s.len*.22),along=(aimS-l.s)*P.dir;

/* ---------- Bea's logbook (flight guide) ---------- */
const BEA=[
  {t:'The two thumbs',h:`<p>Left thumb is the throttle. Right thumb is the stick: touch anywhere on the right side and drag.</p><ul><li><b>Drag down</b> to raise the nose. <b>Drag up</b> to lower it.</li><li><b>Drag sideways</b> to bank. Banking is how you turn.</li><li>The rudder looks after itself while Steady Wings is on.</li></ul><p>Small moves. The plane does what you ask, just a moment later than you'd like.</p>`},
  {t:'Pitch and power',h:`<p>Here's the secret most new pilots fight: <b>the stick sets your speed, the throttle sets climb or descent.</b></p><ul><li>Nose up, slower. Nose down, faster.</li><li>Want to climb without slowing down? Add power.</li><li>Want to come down without speeding up? Take power off.</li></ul><p>Let go of the stick and the plane holds the speed you left it at. That's Auto-trim, doing what a real pilot does with the trim wheel.</p>`},
  {t:'Flaps',h:`<p>Flaps are hinged panels on the back of the wing. Lowering them makes the wing curvier: more lift, and also more drag.</p><table><tr><td>FLAPS 0</td><td><b>Cruise.</b> Clean wing, least drag. Climbing out and flying around.</td></tr><tr><td>FLAPS 1</td><td><b>Takeoff and approach.</b> A bit more lift, so you can fly a few knots slower. Good for short strips and the start of an approach.</td></tr><tr><td>FLAPS 2</td><td><b>Landing.</b> Most lift and most drag. You can come down steeply without speeding up, and touch down slow.</td></tr></table><p>Don't fly fast with flaps out: above 85 knots (the top of the white arc on the speed gauge) they're working too hard. With flaps down you need more power to hold your height.</p>`},
  {t:'The six gauges',h:`<table><tr><td>SPEED</td><td>Airspeed in knots. White arc: flap range. Green: normal. Yellow: careful, smooth air only.</td></tr><tr><td>ATTITUDE</td><td>Blue is sky, brown is ground. The orange wings are you. Shows bank and nose up or down, even when you can't see outside.</td></tr><tr><td>ALTITUDE</td><td>Height in feet above the sea. The long needle is hundreds, the short one thousands. (The readout at the top of the screen is height above the ground, which matters more for landing.)</td></tr><tr><td>HEADING</td><td>Your compass direction. The cyan mark is the way to your next stop.</td></tr><tr><td>CLIMB</td><td>Feet per minute up or down. On approach, about 400 down is right.</td></tr><tr><td>RPM</td><td>Engine speed. The green band is cruise power.</td></tr></table><p>Trick: glance, don't stare. Speed, attitude, back to the window.</p>`},
  {t:'Taking off',h:`<ul><li>Flaps 0 on a long runway, 1 on a short one.</li><li>Full power. Keep straight with small sideways stick.</li><li>At about 45 knots, drag the stick gently down. The nose lifts and the plane flies itself off.</li><li>Climb at 55 to 65 knots. Let go and it holds that.</li><li>Flaps up once you're well above the trees.</li></ul>`},
  {t:'Turning',h:`<p>Bank to turn. The steeper the bank, the faster the turn, but the wing spends some of its lift turning instead of holding you up.</p><ul><li>In a turn, hold the stick a little down (back) to keep the nose up and stay level.</li><li>Gentle turns are about 20 degrees of bank. Thirty is brisk.</li><li>Let go of the stick and Steady Wings rolls you level.</li></ul>`},
  {t:'The approach',h:`<p>A good landing is made two kilometers out.</p><ul><li>On the chart, the runway you're headed for has a <b>dashed line</b> coming out of each end. Fly to that line, then turn to follow it toward the runway.</li><li>About 2 km out and a few hundred feet up: <b>flaps 1</b>, power back, <b>55 knots</b>.</li><li>Watch the <b>four lights</b> beside the runway. Two white and two red: perfect. More white: too high, take off power. More red: too low, add power.</li><li>Closer in: flaps 2, and keep the runway centered in the windshield.</li><li>Do your before-landing checklist.</li></ul>`},
  {t:'Landing numbers',h:`<p>Pin these on your knee. The speed and height readouts turn <b style="color:#3e7334">green</b>, <b style="color:#b8862a">amber</b> or <b style="color:#c2453a">red</b> on approach to tell you how you're doing.</p><table><tr><td>2 KM OUT</td><td><b>Gate 1</b>, about <b>450 ft up</b>, lined up on the dashed line, flaps 1, <b>55 knots</b>. Start heading for it from 4 or 5 km away so you have time to turn in.</td></tr><tr><td>GATES 2 AND 3</td><td>1.3 km (about 300 ft) and 0.7 km (about 160 ft). Keep the diamond in the ring on the line-up meter.</td></tr><tr><td>ON FINAL</td><td><b>50 to 60 knots.</b> Coming down about <b>400 ft/min</b>. Two white and two red lights.</td></tr><tr><td>OVER THE END</td><td>Flaps 2, power to idle, <b>about 50 knots</b>, 30 to 50 ft up.</td></tr><tr><td>FLARE</td><td>At <b>10 to 20 ft</b>, ease the nose up a little. The meter switches to FLARE: put both markers in the green, <b>nose up 2 to 8°</b> and <b>sink under 300 ft/min</b>.</td></tr><tr><td>TOUCHDOWN</td><td>Wings level (<b>under 10°</b> of bank), nose slightly up, about <b>45 to 50 knots</b>.</td></tr></table><p>The height readout is <b>feet above the ground under you</b>, not above the sea. Trees are about 30 to 45 ft tall; a house is about 20. Near the runway you'll hear little beeps at 100, 50, 30, 20 and 10 ft.</p><p>Over 800 ft/min at touchdown and Gus gets a phone call.</p>`},
  {t:'Landing and stopping',h:`<ul><li>Aim at the white markers about a quarter of the way down the runway.</li><li>Just above the runway, <b>ease the stick down (back)</b> to raise the nose a little. This is the flare: it turns a drop into a settle.</li><li>Power to idle as the wheels touch.</li><li>Hold <b>BRAKE</b>. It builds up the longer you hold: tap it for a little, hold it for a lot.</li></ul><p>Under 180 ft/min is soft. Under 90 is butter.</p>`},
  {t:'Stalls',h:`<p>A wing can only meet the air so steeply. Push past that and it stalls: it stops lifting, and the nose drops.</p><ul><li>The horn and the red STALL sign mean you're close.</li><li><b>Fix it: lower the nose.</b> Speed comes back, the wing works again. Then add power.</li><li>Slow, steep and turning is where stalls happen. On approach, watch the speed.</li></ul><p>Stall Guard stops you pulling into one. Turn it off in Settings when you want to feel it.</p>`},
  {t:'Before-landing checklist',h:`<p>I did this every single landing for forty years. Four things:</p><table><tr><td>CARB HEAT</td><td>ON. Low power on approach is when carb ice forms.</td></tr><tr><td>MIXTURE</td><td>RICH, so full power is there if you need to go around.</td></tr><tr><td>FLAPS</td><td>1 or 2.</td></tr><tr><td>LANDING LIGHT</td><td>ON at sunset, blue hour and night.</td></tr></table><p>The checklist box shows up on approach. Land with all of it done and Mabel adds a bonus stamp.</p>`},
  {t:'Carb heat and mixture',h:`<p><b>Carb ice.</b> The carburetor mixes fuel and air, and it gets cold inside, cold enough to freeze damp air. At low power it can ice up and the engine runs rough and weak. CARB HEAT warms the air going in and melts it, at the cost of a little power. Running rough on a long descent? Carb heat on.</p><p><b>Mixture.</b> Higher up the air is thinner, so the engine wants less fuel. Leaning (MIX LEAN) above 2,000 ft gives a little more power. Down low, lean means too little fuel: keep it RICH.</p>`},
  {t:'Flying by the gauges',h:`<p>In cloud or fog you can't trust your body; it will swear you're level when you're turning. Trust the attitude gauge.</p><ul><li>Keep the orange wings level on the horizon line.</li><li>On approach, the <b>line-up meter</b> at the top: the diamond is where the path is. Fly gently toward it until it sits in the ring.</li></ul>`},
  {t:'Air drops',h:`<p>Some folk camp out too far from a runway for the mail. For them we drop parcels on little parachutes.</p><ul><li>When you load the bag, Mabel may hand you one, two or three air drops. She'll only know which <b>island</b> they're on, so it's a dashed circle on the chart. Keep a lookout for <b>orange smoke</b>: under it is a painted <b>bullseye</b> and someone waving.</li><li>Tap the <b>target</b> button on the left to bring up LOOK DOWN and DROP.</li><li>Fly over low and steady, 300 to 400 ft up. With LOOK DOWN on, the <b>crosshair is where the parcel lands</b> if you let go now. It falls a long way forward, so let go well before you're over the rings.</li><li>The moment it's out you'll be told if it's heading for the rings or going wide, and which way. The chute pops low, so it's down in a few seconds.</li><li>A good drop: they cheer, and the camp packs itself up. Land at any field for more parcels.</li></ul>`},
  {t:'Night flying',h:`<ul><li>Runways have edge lights at night. Amber ones mark the ends.</li><li>Turn on your landing light on approach: it lights the runway in front of you.</li><li>The approach lights work just the same at night, so trust them over your eyes.</li><li>Some things on the islands only show themselves after dark. Go looking at blue hour or night: a few of them glow.</li></ul>`},
];

    $('cardBody').querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>bea(+b.dataset.p)));return;}

      const pts=new THREE.Points(G,new THREE.PointsMaterial({color:0x8ff0e0,size:2,sizeAttenuation:false}));g.add(pts);C.pts=pts;
      const jar=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,1.2,10),new THREE.MeshBasicMaterial({color:0x9fd8d0,transparent:true,opacity:.7}));jar.position.set(0,2.2,-CD+3);g.add(jar);}
    scene.add(g);C.g=g;
    // flying into it is like flying into any rock: side walls and the roof
    const tx=C.nz,tz=-C.nx;
    for(let a=-2;a<=CD+20;a+=12){const cx=C.mx-C.nx*a,cz=C.mz-C.nz*a;
      for(const s of [-1,1])solidCyl(cx+tx*s*(CW/2+6),cz+tz*s*(CW/2+6),-6,CHO*.8,6,4);
      solidCyl(cx,cz,CHI+2,CHO,CW/2+3,CW/2);}
    solidCyl(C.mx-C.nx*(CD+6),C.mz-C.nz*(CD+6),-6,CHO,CW/2+2,CW/2);}})();
/* the cave's frame: a = how far inside the mouth (negative = out on the water), b = sideways from the center line */
const caveLocal=(C,x,z)=>({a:(C.mx-x)*C.nx+(C.mz-z)*C.nz,b:(x-C.mx)*C.nz-(z-C.mz)*C.nx});
let caveHintT=0,caveBusy=false;const caveHinted={};
function caveEnter(C){caveBusy=true;mode='card';ac.u=0;
  const first=!log.caves[C.id];if(first){log.caves[C.id]=Date.now();saveL();addCoins(C.coins);stamp(1);addScore(250);goal('cave',true);if(CAVES.every(q=>log.caves[q.id]))goal('caves3',true);}
  snd.beep(660);setTimeout(()=>snd.beep(990),120);
  const n=CAVES.filter(q=>log.caves[q.id]).length;
  showCard(`<h2>${C.name}</h2><div class="sub">SECRET SEA CAVE · ${n} OF ${CAVES.length} FOUND</div><p class="say">${first?C.say:'The cave is just as you left it: cool, dark and echoing. Nothing more to find, but it\'s a good place to sit out the rain.'}</p>${first?`<div class="got">+1 STAMP · +250 · +${C.coins} COINS</div>`:''}`,
    [['Taxi back out',()=>caveExit(C),true]]);}
function caveExit(C){const x=C.mx+C.nx*40,z=C.mz+C.nz*40;ac.pos.set(x,AC.gearH+floatLift(),z);ac.gYaw=Math.atan2(-C.nx,-C.nz);ac.gPitch=0;ac.u=0;ac.vel.set(0,0,0);ac.ground=true;
  ac.q.setFromEuler(_e.set(0,ac.gYaw,0,'YXZ'));snapCam=true;hideModal();mode='fly';caveBusy=false;toast('Back out on open water. Full throttle when you\'re ready.',2.4);}
anims.push(()=>{if(mode!=='fly'||caveBusy)return;
  for(const C of CAVES){const dx=ac.pos.x-C.mx,dz=ac.pos.z-C.mz;if(dx*dx+dz*dz>200*200)continue;
    const L=caveLocal(C,ac.pos.x,ac.pos.z);
    if(ac.ground){
      // in the channel: keep the wings off the walls; deep enough in and the cave takes over
      if(L.a>-2&&L.a<CD&&Math.abs(L.b)<CWO){
        const lim=CW/2-AC.span/2-.6;
        if(Math.abs(L.b)<CW/2){if(L.a>0&&Math.abs(L.b)>lim){const s=Math.sign(L.b),push=Math.abs(L.b)-lim;ac.pos.x-=C.nz*s*push;ac.pos.z+=C.nx*s*push;}}
        else if(L.a<4){const push=L.a+2;ac.pos.x+=C.nx*push;ac.pos.z+=C.nz*push;ac.u*=.2;}   // nosed into the rock beside the mouth
        else{const s=Math.sign(L.b)||1,push=CWO-Math.abs(L.b);ac.pos.x+=C.nz*s*push;ac.pos.z-=C.nx*s*push;ac.u*=.2;}}
      if(L.a>CD*.45&&Math.abs(L.b)<CW/2){caveEnter(C);return;}}
  }
  // a nudge when you're on the water near a cave you haven't found
  caveHintT-=1/60;if(caveHintT>0||!ac.ground||groundH(ac.pos.x,ac.pos.z)>.25)return;caveHintT=2;
  for(const C of CAVES){if(log.caves[C.id]||caveHinted[C.id])continue;if(Math.hypot(ac.pos.x-C.mx,ac.pos.z-C.mz)<600){caveHinted[C.id]=1;toast(`Your co-pilot's ears prick up. There's a dark opening in the cliffs, right at the waterline.`,3.5);}}});

/* ---------- save backup and dev mode ----------
   Progress lives only in this browser's storage (on an iPhone, each home-screen icon has its own). The save code
   packs it into one line of text you can paste into any other install. Dev mode (tap the build number in Settings
   five times) unlocks a test panel; turning it on first backs up your real progress, turning it off puts it back. */
const SAVE_KEYS={s:'tac-settings',l:'tac-log',r:RESUME},DEV_BACKUP='tac-devbackup';
const rawGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}},rawSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
/* write straight to storage and reload, with the game's own saving switched off so nothing overwrites it on the way out */
function hardReload(){store.set=()=>{};location.reload();}
function saveCode(){saveL();saveS();const d={};for(const [k,key] of Object.entries(SAVE_KEYS))d[k]=rawGet(key);
  if(settings.dev){const b=JSON.parse(rawGet(DEV_BACKUP)||'{}');d.l=b.l??d.l;d.r=b.r??d.r;}   // in dev mode, back up the real save, not the test one
  return 'SALTSTONE1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d))));}
function readCode(t){t=(t||'').trim().replace(/\s+/g,'');if(!t.startsWith('SALTSTONE1:'))return null;try{const d=JSON.parse(decodeURIComponent(escape(atob(t.slice(11)))));return d&&d.l?d:null;}catch(e){return null;}}
function saveCodeCard(){const code=saveCode();
  showCard(`<h2>Copy save code</h2><div class="sub">ALL YOUR PROGRESS IN ONE LINE</div><p>Copy this and keep it in Notes, or paste it into another install with <b>Load save code</b>.</p>
    <textarea id="saveTxt" readonly style="width:100%;height:110px;font:12px var(--mono);word-break:break-all;background:#fff8ec;border:2px solid #241c2e;border-radius:6px;padding:6px">${code}</textarea>`,
    [['Copy',()=>{const t=$('saveTxt');t.select();(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast('Save code copied.',1.6)).catch(()=>{try{document.execCommand('copy');toast('Save code copied.',1.6);}catch(e){toast('Select the text and copy it by hand.',2);}});},true],['Back',settingsCard]]);}
function loadCodeCard(){
  showCard(`<h2>Load save code</h2><div class="sub">REPLACES THE PROGRESS IN THIS INSTALL</div><p>Paste a save code from another install.</p>
    <textarea id="loadTxt" style="width:100%;height:110px;font:12px var(--mono);word-break:break-all;background:#fff8ec;border:2px solid #241c2e;border-radius:6px;padding:6px" placeholder="SALTSTONE1:..."></textarea>`,
    [['Load it',()=>{const d=readCode($('loadTxt').value);if(!d){toast('That doesn\'t look like a save code.',2);return;}
      let L={};try{L=JSON.parse(d.l);}catch(e){}
      showCard(`<h2>Replace your progress?</h2><p>The code has <b>day ${L.mail?L.mail.day:1}</b>, <b>${L.stamps||0} stamps</b> and <b>${(L.coins||0).toLocaleString()} coins</b>. What's in this install now will be replaced.</p>`,
        [['Replace it',()=>{rawSet(SAVE_KEYS.l,d.l);rawSet(SAVE_KEYS.r,d.r);if(d.s){let S={};try{S=JSON.parse(d.s);}catch(e){}S.dev=false;rawSet(SAVE_KEYS.s,JSON.stringify(S));}rawSet(DEV_BACKUP,null);hardReload();},true],['Cancel',loadCodeCard]]);},true],['Back',settingsCard]]);}
/* extra rows at the foot of Settings, and the five taps on the build number */
let devTaps=0,devTapT=0;
function settingsExtras(){const cb=$('cardBody');
  const box=document.createElement('div');box.innerHTML=`<h3>SAVE BACKUP · YOUR PROGRESS LIVES ONLY ON THIS DEVICE</h3><div class="btns"><button id="svCopy">COPY SAVE CODE</button><button id="svLoad">LOAD SAVE CODE</button></div>${settings.dev?'<h3 style="color:#c2456a">DEV MODE IS ON · YOUR REAL SAVE IS BACKED UP</h3><div class="btns"><button id="devOpen" class="primary">DEV PANEL</button><button id="devOff">TURN OFF DEV MODE</button></div>':''}`;
  const bn=[...cb.querySelectorAll('.sub')].find(e=>/BUILD/.test(e.textContent));cb.insertBefore(box,bn||null);
  $('svCopy').onclick=saveCodeCard;$('svLoad').onclick=loadCodeCard;
  if(settings.dev){$('devOpen').onclick=devPanel;$('devOff').onclick=devOffCard;}
  if(bn){bn.style.cursor='pointer';bn.onclick=()=>{const t=performance.now();devTaps=t-devTapT<700?devTaps+1:1;devTapT=t;
    if(devTaps>=5){devTaps=0;if(!settings.dev)devOn();else toast('Dev mode is already on.',1.4);}else if(devTaps>=3&&!settings.dev)toast(`${5-devTaps} more for dev mode`,.8);};}}
function devOn(){saveL();rawSet(DEV_BACKUP,JSON.stringify({l:rawGet(SAVE_KEYS.l),r:rawGet(SAVE_KEYS.r),ts:Date.now()}));settings.dev=true;saveS();snd.beep(1320);
  toast('Dev mode on. Your real progress is backed up.',2.2);devPanel();}
function devOffCard(){showCard(`<h2>Turn off dev mode?</h2><p>Your real progress comes back exactly as it was when you turned dev mode on. Everything you did in dev mode is thrown away.</p>`,
  [['Turn it off',()=>{const b=JSON.parse(rawGet(DEV_BACKUP)||'null');if(b){rawSet(SAVE_KEYS.l,b.l);rawSet(SAVE_KEYS.r,b.r);}rawSet(DEV_BACKUP,null);settings.dev=false;rawSet(SAVE_KEYS.s,JSON.stringify(settings));hardReload();},true],['Back',settingsCard]]);}
function devUnlockAll(){SH.plane.owned=PLANES.map(p=>p.id);SH.paint.owned=PAINTS.map(p=>p[0]);SH.smoke.owned=SMOKES.map(p=>p[0]);for(const u of UPG)SH[u.id]=u.max;saveL();applyUpgrades();}
function devResetGarage(){SH.plane={owned:['cub'],sel:'cub'};SH.paint={owned:['classic'],sel:'classic'};SH.smoke={owned:['white'],sel:'white'};for(const u of UPG)SH[u.id]=0;saveL();applyUpgrades();}
function devAll(obj,list,on){for(const k of list){if(on)obj[k]=obj[k]||Date.now();else delete obj[k];}saveL();}
function devToCave(C){SH.plane.owned.includes('float')||SH.plane.owned.push('float');SH.plane.sel='float';applyUpgrades();
  const s=stripById('harbor');spawnQuiet=true;try{spawnField(s);}finally{spawnQuiet=false;}
  setFloats(true);ac.floats=1;const x=C.mx+C.nx*90,z=C.mz+C.nz*90;ac.pos.set(x,AC.gearH+floatLift(),z);ac.gYaw=Math.atan2(C.nx,C.nz);ac.gPitch=0;ac.u=0;ac.vel.set(0,0,0);ac.ground=true;
  ac.q.setFromEuler(_e.set(0,ac.gYaw,0,'YXZ'));snapCam=true;hideModal();$('title').hidden=true;startFly();toast(`On the water outside ${C.name}. Taxi straight in.`,2.4);}
function devPanel(){const n=(o,l)=>l.filter(k=>o[k]).length,sk=Object.keys(sights),gk=GOALS.map(g=>g.id),ck=CAVES.map(c=>c.id);
  const row=(label,btns)=>`<div class="tog"><div><b>${label}</b></div><div class="btns" style="margin:0;justify-content:flex-end">${btns}</div></div>`;

  showCard(`<h2>Dev panel</h2><div class="sub" style="color:#c2456a">TEST FREELY · YOUR REAL SAVE COMES BACK WHEN YOU TURN DEV MODE OFF</div>
    ${row(`Coins: ${log.coins.toLocaleString()}`,b('coins','+1,000')+b('coins0','ZERO'))}
    ${row('Garage: planes, parts, paint, smoke',b('unlock','UNLOCK ALL')+b('garage','RESET')+b('shop','OPEN SHOP'))}
    ${row(`Mail: day ${mail.day}${mail.active?' (running)':''}`,b('dayDn','−')+b('dayUp','+')+b('dayGo','START IT'))}
    ${row(`Sea caves: ${n(log.caves,ck)} of ${ck.length}`,b('cavesAll','ALL')+b('cavesNone','NONE'))}
    ${row(`Landmarks: ${n(log.sights,sk)} of ${sk.length}`,b('sightsAll','ALL')+b('sightsNone','NONE'))}
    ${row(`Logbook goals: ${n(log.goals,gk)} of ${gk.length}`,b('goalsAll','ALL')+b('goalsNone','NONE'))}
    ${row('Chart every island',b('chart','CHART ALL'))}
    <h3>GO TO A SEA CAVE (ON FLOATS)</h3><div class="btns">${CAVES.map((C,i)=>`<button data-cave="${i}">${C.name.toUpperCase()}</button>`).join('')}</div>
    <h3>GO TO A FIELD</h3><div class="btns"><button data-dev="fields">PICK A FIELD</button></div>`,
    [['Back',settingsCard,true],['Turn off dev mode',devOffCard]]);
  const A={coins:()=>addCoins(1000),coins0:()=>{log.coins=0;saveL();updScore();},unlock:devUnlockAll,garage:devResetGarage,
    shop:()=>{shopCard(stripById('harbor'),devPanel);return true;},
    dayDn:()=>{mail.day=Math.max(1,mail.day-1);mail.active=false;mail.bag=[];saveL();refreshBag();},dayUp:()=>{mail.day=Math.min(DAYS.length+1,mail.day+1);mail.active=false;mail.bag=[];saveL();refreshBag();},
    dayGo:()=>{offerDay(()=>{hideModal();mode=mode==='title'?'title':'fly';});return true;},
    cavesAll:()=>devAll(log.caves,ck,true),cavesNone:()=>devAll(log.caves,ck,false),sightsAll:()=>devAll(log.sights,sk,true),sightsNone:()=>devAll(log.sights,sk,false),

  $('cardBody').querySelectorAll('[data-dev]').forEach(el=>el.addEventListener('click',()=>{snd.click();if(!A[el.dataset.dev]())devPanel();}));
  $('cardBody').querySelectorAll('[data-cave]').forEach(el=>el.addEventListener('click',()=>devToCave(CAVES[+el.dataset.cave])));}


/* ---------- main loop ---------- */
let acc=0,last=performance.now(),fpsN=0,fpsT=0,fpsLast=0,fpsPrev=0,fpsMin=999;renderer.info.autoReset=false;
function loop(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;const t=now/1000;
  skyMat.uniforms.uTime.value=t;waterMat.uniforms.uTime.value=t;for(const a of anims)a(t);
  cloudGroup.position.set((t*2.2)%4000,0,-(t*.8)%4000);
  {const pu=postMat.uniforms;pu.mist.value=lerp(pu.mist.value,cloudMist(camera.position),1-Math.exp(-dt*9));pu.mistC.value.copy(scene.fog.color).lerp(_mistW,.3);pu.fN.value=scene.fog.near;pu.fF.value=scene.fog.far;}
  if(mode==='fly'){readInput(dt);acc+=dt;const H_=1/120;let n=0;while(acc>=H_&&n<10){if(ac.ground)stepGround(H_);else{stepAir(H_);stepBoost(H_);stepUp(H_);stepBumps(H_);if(typeof stepWeather==='function')stepWeather(H_);if(typeof stepGuard==='function')stepGuard(H_);}simT+=H_;acc-=H_;n++;if(mode!=='fly')break;}if(n>=10)acc=0;
    if(!Number.isFinite(ac.pos.x+ac.pos.y+ac.pos.z+ac.vel.x+ac.vel.y+ac.vel.z+ac.q.x+ac.q.w)){console.warn('sim NaN, respawning');spawnField(stripById(ac.lastField)||STRIPS[0]);}
    if(mode==='fly'){gameChecks(dt);playChecks(dt);}runTips(dt);}
  else acc=0;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}
  if(callT>0){callT-=dt;if(callT<=0)$('callout').hidden=true;}
  updateVisuals(dt,t);updateCam(dt,t);cullChunks(camera.position);waterMat.uniforms.uCamY.value=camera.position.y;if(typeof spotUniforms==='function'){camera.updateMatrixWorld();spotUniforms();}sky.position.copy(camera.position);
  renderer.info.reset();renderer.setRenderTarget(rt);renderer.render(scene,camera);const tri=renderer.info.render.triangles,dc=renderer.info.render.calls;renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  drawHUD(dt);
  if(settings.fps){fpsN++;fpsT+=now-(fpsLast||now);fpsLast=now;fpsMin=Math.min(fpsMin,1000/Math.max(now-(fpsPrev||now-16),1));fpsPrev=now;
    if(fpsT>=500){$('fps').textContent=`${Math.round(fpsN*1000/fpsT)} FPS · LOW ${Math.round(fpsMin)} · ${(tri/1e6).toFixed(2)}M TRI · ${dc} DRAWS · ${LW}×${LH}`;fpsN=0;fpsT=0;fpsMin=999;}}
  requestAnimationFrame(loop);
}

(function hideLoader(){const L=$('loader');if(!L)return;let done=false;const go=()=>{if(done)return;done=true;if(typeof scriptify==='function')try{scriptify(document);}catch(e){}L.style.opacity='0';setTimeout(()=>L.remove(),500);};
  const fonts=document.fonts?Promise.all([document.fonts.load('16px "Pixelify Sans"'),document.fonts.load('20px VT323'),document.fonts.load('700 26px "Dancing Script"')]).catch(()=>{}):Promise.resolve();
  const frames=new Promise(r=>{let n=0;const f=()=>{if(++n>=3)r();else requestAnimationFrame(f);};requestAnimationFrame(f);});
  Promise.all([fonts,frames]).then(()=>setTimeout(go,120));setTimeout(go,12000);})();
