<title>Saltwhistle Skies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: full-bleed pixel render; flight data along the top edge, throttle under the left thumb, stick zone under the right thumb; paper-card overlays for menus. One committed dusk-arcade look. */
:root{
  --ink:#241c2e; --ink2:#4a3d55; --paper:#f5e8cf; --paper2:#e3cda4; --accent:#e2703f; --accent2:#b5512b;
  --good:#5c9e4f; --warn:#f1c84a; --bad:#e5483b; --glass:rgba(36,28,46,.74); --line:#5a4a63;
  --display:'Pixelify Sans','VT323',ui-monospace,monospace; --fancy:'Jacquarda Bastarda 9','Pixelify Sans',serif; --mono:'VT323',ui-monospace,monospace;
  --sl:max(10px, env(safe-area-inset-left, 0px)); --sr:max(10px, env(safe-area-inset-right, 0px));
  --st:calc(6px + env(safe-area-inset-top, 0px)); --sb:calc(8px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#1f1a2b;color:var(--paper);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--display)}
#gl,#hud{position:fixed;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated}
#hud{pointer-events:none}
button{font:inherit;color:var(--ink);background:var(--paper);border:0;border-radius:0;padding:8px 12px;cursor:pointer;touch-action:manipulation;
  box-shadow:inset -3px -3px 0 var(--paper2), 0 3px 0 #0007}
button:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 var(--paper2), 0 1px 0 #0007}
button.primary{background:var(--accent);color:#fff8ec;box-shadow:inset -3px -3px 0 var(--accent2), 0 3px 0 #0007}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* flight HUD */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:var(--st) var(--sr) 0 var(--sl);pointer-events:none}
.pill{pointer-events:auto;font-family:var(--mono);font-size:21px;line-height:1;background:var(--glass);color:var(--paper);padding:7px 9px;border:2px solid var(--line);
  box-shadow:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:13px;opacity:.75;margin-left:3px}
#spd.warn{background:var(--bad);border-color:#ffb0a0}
.pill.ok{background:rgba(52,110,48,.85);border-color:#8fe08a}.pill.caution{background:rgba(170,120,30,.9);border-color:#f1c84a}
#vsi.ok{color:#8fe08a}#vsi.caution{color:#f1c84a}#vsi.bad{color:#ff8a7a}
#callout{z-index:5;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:42px;color:var(--paper);text-shadow:3px 3px 0 var(--ink);pointer-events:none}
#vsi{font-size:15px;margin-left:6px;opacity:.9}
#dest{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:8px 10px;color:var(--paper);background:var(--glass);border:2px solid var(--line);box-shadow:none}
#dest .arr{display:inline-block;width:12px;text-align:center;color:#6fe0e0;margin-right:4px}
.sp{flex:1}
#todBtn,#radioBtn{pointer-events:auto;padding:3px 5px;line-height:0}#todBtn img,#radioBtn img{width:32px;height:32px;image-rendering:pixelated;display:block}
#view,#pause,#center{pointer-events:auto;font-family:var(--mono);font-size:15px;padding:8px 10px}
#stallBan{z-index:5;position:fixed;left:50%;top:calc(var(--st) + 44px);transform:translateX(-50%);font-family:var(--mono);font-size:20px;background:var(--bad);color:#fff;padding:5px 12px;letter-spacing:.1em;pointer-events:none}
#toast{z-index:26;white-space:pre-line;position:fixed;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);max-width:min(520px,52vw);background:var(--paper);color:var(--ink);padding:9px 13px;font-size:15px;line-height:1.3;
  box-shadow:4px 4px 0 #0008;pointer-events:none;text-align:center;text-wrap:balance}


/* controls: an analog panel. Throttle quadrant lever on the left, a rail of little toggle buttons beside it, and
   panels (map, today's jobs, landing controls, air drop) that fold away so you can just look at the view */
#thr{position:fixed;left:var(--sl);top:calc(var(--st) + 50px);bottom:var(--sb);width:58px;touch-action:none;z-index:2;
  background:linear-gradient(90deg,#3b3542,#2c2733 45%,#24202b);border:2px solid #15121a;box-shadow:inset 2px 2px 0 #4d4656,inset -2px -2px 0 #1a161f}
#thr .lab{position:absolute;left:0;right:0;top:4px;text-align:center;font:9px/1 var(--mono);letter-spacing:.08em;color:#cfc4b2}
#thrSlot{position:absolute;left:50%;top:22px;bottom:36px;width:8px;margin-left:-4px;background:#0d0b10;box-shadow:inset 2px 0 0 #000,1px 0 0 #4d4656}
#thrTicks{position:absolute;right:4px;top:22px;bottom:36px;width:6px;background:repeating-linear-gradient(#cfc4b2 0 1px,transparent 1px 10%)}
#thrKnob{position:absolute;left:3px;right:3px;height:24px;transform:translateY(50%);border-radius:7px 7px 4px 4px;
  background:linear-gradient(#55505c,#18151c 40%,#0b090d);box-shadow:inset 0 2px 0 #8a8492,0 3px 0 #000a;pointer-events:none}
#thrKnob::after{content:'';position:absolute;left:6px;right:6px;top:9px;height:2px;background:#e2703f}
#thrPct{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);font-size:14px;color:#ffd36b}
#rail{position:fixed;left:calc(var(--sl) + 64px);top:calc(var(--st) + 50px);display:flex;flex-direction:column;gap:4px;z-index:2}
.rb{width:34px;height:34px;padding:2px;line-height:0;background:#2c2733;box-shadow:inset 2px 2px 0 #4d4656,inset -2px -2px 0 #16131b,0 2px 0 #0008;opacity:.75}
.rb img{width:30px;height:30px;image-rendering:pixelated}
.rb.on{background:#4a4255;opacity:1;box-shadow:inset 2px 2px 0 #6b6276,inset -2px -2px 0 #241f2a,0 2px 0 #0008}
.rb.nudge{animation:nudge 1s infinite}@keyframes nudge{50%{background:#e2703f;opacity:1}}
#wind{width:34px;height:48px;padding:0;font-family:var(--mono);font-size:10px;line-height:1;color:var(--ink);background:linear-gradient(to top,#ffd36b var(--w,0%),#fff0c4 var(--w,0%));box-shadow:inset -2px -2px 0 #b8902e, 0 2px 0 #0007;pointer-events:auto}
#wind img{width:28px;height:28px;image-rendering:pixelated;display:block;margin:2px auto 1px}
#wind span{display:block;font-size:10px;color:#a0601e}
#wind.on{background:#ffd36b}
#wind.off{opacity:.55}
#wind.cool{background:linear-gradient(to top,#c9a85a var(--w,0%),#6a5a48 var(--w,0%));color:var(--paper)}
#wind.cool span{color:var(--paper)}
#pcol{position:fixed;left:calc(var(--sl) + 106px);top:calc(var(--st) + 50px);width:124px;display:flex;flex-direction:column;gap:6px;z-index:2}
#mapc{width:124px;height:124px;image-rendering:pixelated;border:2px solid var(--line);background:#1d2a44;display:block;box-sizing:border-box;cursor:pointer}
#job{background:var(--glass);border:2px solid #b8902e;padding:3px 5px 4px;font-family:var(--mono);font-size:13px;line-height:1.15;color:#ffd890;cursor:pointer;pointer-events:auto;width:150px;box-sizing:border-box}
#job .jh{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--paper);opacity:.85;letter-spacing:.04em}
#score{color:#ffd36b}#score.pop{animation:pop .5s}@keyframes pop{30%{transform:scale(1.15);color:#fff}}
#jDrop.done{color:#8fe08a}#jDrop{color:#ff9a6a}
/* landing controls: small separate switches along the bottom, brake right next to the throttle */
#eng{position:fixed;left:calc(var(--sl) + 64px);bottom:var(--sb);display:flex;gap:5px;align-items:flex-end;z-index:2}
.tsw,#brake,#flapL,#micBtn{position:relative;width:40px;height:58px;padding:0;border-radius:7px;background:rgba(28,24,34,.78);
  box-shadow:inset 0 0 0 1px #5a5266,inset 0 2px 0 #ffffff14,0 2px 0 #0009;touch-action:manipulation}
.tsw:active,#brake:active,#micBtn:active{transform:none}
.lab{position:absolute;left:-3px;right:-3px;top:4px;text-align:center;font:8px/1 var(--mono);letter-spacing:.02em;color:#d8cebe;white-space:nowrap;pointer-events:none}
.tsw .nut{position:absolute;left:50%;top:34px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0eef4,#9a96a2 55%,#55515c);box-shadow:0 0 0 1.5px #15121a}
.tsw .bat{position:absolute;left:50%;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(90deg,#8c8896,#f4f2f8 45%,#a4a0ac);box-shadow:0 0 0 1px #15121a;transition:top .07s,height .07s}
.tsw.on .bat{top:16px;height:18px}.tsw:not(.on) .bat{top:34px;height:15px;filter:brightness(.8)}
.tsw em{position:absolute;left:0;right:0;bottom:3px;font:normal 8px/1 var(--mono);text-align:center;color:#a49cae;pointer-events:none}
.tsw em.u{display:none}.tsw.on em.u{display:block;color:#8fe08a}.tsw.on em.d{display:none}
.tsw.warn{animation:warnb .6s infinite}@keyframes warnb{50%{background:#7a5c18}}
#flapL{width:42px;cursor:ns-resize;touch-action:none}
#flapL .fslot{position:absolute;left:11px;top:16px;bottom:8px;width:4px;background:#0d0b10}
#flapL .fd{position:absolute;right:5px;font:9px/1 var(--mono);color:#7b7385;transform:translateY(-50%);pointer-events:none}
#flapL .fd.on{color:#ffd36b}
#flapH{position:absolute;left:3px;width:20px;height:9px;transform:translateY(-50%);transition:top .12s;pointer-events:none;
  background:linear-gradient(#ffffff,#d8d2c8);clip-path:polygon(0 30%,20% 0,100% 35%,100% 65%,20% 100%,0 70%);filter:drop-shadow(0 1px 0 #000)}
#brake{width:46px;height:64px;touch-action:none;background:linear-gradient(to top, rgba(140,40,32,.9) var(--b,0%), rgba(28,24,34,.78) var(--b,0%))}
#brake .ped{position:absolute;left:8px;right:8px;top:17px;bottom:7px;border-radius:3px;background:repeating-linear-gradient(#5a5560 0 3px,#2a2630 3px 6px);box-shadow:0 0 0 1.5px #15121a}
#brake.on .ped{background:repeating-linear-gradient(#e5483b 0 3px,#8a2a22 3px 6px)}
#check{position:fixed;left:calc(var(--sl) + 240px);top:calc(var(--st) + 50px);background:var(--glass);border:2px solid var(--line);padding:6px 9px;font-family:var(--mono);font-size:14px;line-height:1.6;pointer-events:none;z-index:2}
#check b{display:block;font-size:9px;opacity:.75;letter-spacing:.06em}
@media (max-height:520px){#pcol{flex-direction:row;align-items:flex-start;width:auto}#check{left:calc(var(--sl) + 404px)}}
#check .ok{color:#8fe08a}
#fps{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 46px);white-space:nowrap;background:var(--glass);color:var(--paper);font-family:var(--mono);font-size:13px;padding:3px 6px;pointer-events:none;z-index:1}
/* accessories: a column of small switches down the right edge, with the air-drop buttons beside it when needed */
#rcol{position:fixed;right:var(--sr);top:calc(var(--st) + 50px);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:6px;z-index:3}
#fun{display:flex;flex-direction:column;gap:5px}
.tsw.red .bat{background:linear-gradient(90deg,#8a1e18,#ff6a5a 45%,#a4281f)}.tsw.red.on em.u{color:#ff9a6a}
#micBtn .grille{position:absolute;left:9px;right:9px;top:15px;height:26px;border-radius:5px;background:repeating-radial-gradient(circle at 50% 50%,#55505c 0 1.2px,#141118 1.2px 3px);box-shadow:0 0 0 1.5px #0b090d,0 2px 0 #000}
#micBtn:active .grille{transform:translateY(2px);box-shadow:0 0 0 1.5px #0b090d}
#micBtn em{position:absolute;left:0;right:0;bottom:3px;font:normal 8px/1 var(--mono);color:#ffd36b;text-align:center}
#dropUI{display:flex;flex-direction:column;gap:6px}
#dropUI button{font-family:var(--mono);font-size:14px;line-height:1.1;padding:8px 10px;min-width:62px}
#lookBtn.on{background:var(--good);color:#fff;box-shadow:inset -3px -3px 0 #3e7334, 0 3px 0 #0007}
#dropBtn{background:#e2703f;color:#fff8ec;box-shadow:inset -3px -3px 0 #b5512b, 0 3px 0 #0007}#dropBtn.empty{opacity:.55}
#stick{position:fixed;left:42%;right:0;top:calc(var(--st) + 50px);bottom:0;touch-action:none}
#ring{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border:2px dashed #f5e8cf99;border-radius:50%;pointer-events:none}
#ring.idle{opacity:.55}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;background:var(--paper);border-radius:50%;box-shadow:0 3px 0 #0008}
#ringHint{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--paper);opacity:.8}

/* overlays */
#chartOv{position:fixed;inset:0;z-index:28;background:#1e4878;border:3px solid #fff8ec;box-sizing:border-box}
#chartOv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#chartLeg{position:absolute;left:calc(var(--sl) + 4px);top:calc(var(--st) + 2px);font-family:var(--mono);font-size:12px;line-height:1.15;color:var(--paper);background:rgba(20,34,58,.6);padding:3px 6px;max-width:42%;pointer-events:none}
#chartLeg b{color:#ffd36b;letter-spacing:.06em}
#chartLeg{animation:legfade .8s 4s forwards}@keyframes legfade{to{opacity:0}}
#chartX{position:absolute;right:calc(var(--sr) + 2px);top:calc(var(--st) + 2px);width:36px;height:36px;padding:0;font-size:18px;line-height:1;background:var(--paper);color:var(--ink)}
.who{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.who img{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--ink);flex:none}
.px-img{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.who b{display:block;font-size:22px;line-height:1.05;font-weight:700}
.who span{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:.05em}
.say{font-size:18px!important;line-height:1.35}
.got{font-family:var(--mono);font-size:15px;color:var(--ink2);margin:6px 0 4px}
.page h4{font-family:var(--mono);font-size:15px;letter-spacing:.06em;color:var(--ink2);margin:10px 0 4px}
.page ul{margin:0 0 10px;padding-left:20px;font-size:15px;line-height:1.4}
.page table{border-collapse:collapse;font-size:14px;margin:4px 0 12px;width:100%}
.page td{color:var(--ink);border-top:2px dashed var(--paper2);padding:6px 6px 6px 0;vertical-align:top}
.page td:first-child{font-family:var(--mono);font-size:15px;white-space:nowrap;color:var(--ink2)}
#bigmap{width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--ink);display:block;margin:4px 0 10px;background:#1d2a44}
.card.wide{width:min(760px,100%)}
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) var(--sr) calc(12px + env(safe-area-inset-bottom,0px)) var(--sl);background:rgba(28,22,38,.35);overflow:auto}
.card{background:var(--paper);color:var(--ink);width:min(520px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-shadow:6px 6px 0 #000a;border:3px solid var(--ink);box-sizing:border-box}
.card .topbar{display:flex;gap:8px;margin:-6px 0 10px;position:sticky;top:-18px;z-index:2;background:var(--paper);padding:6px 0 4px}
.card .backbtn{font-family:var(--mono);font-size:17px;padding:6px 12px}
.card h2{margin:0 0 4px;font-size:26px;line-height:1.05;font-weight:700;text-wrap:balance}
.card .sub{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--ink2);margin-bottom:12px}
.card p{margin:0 0 10px;font-size:16px;line-height:1.35}
.rows{color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:baseline;margin:6px 0 14px;font-size:16px}
.rows .k{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:.05em}
.rows .s{color:#c9842a;letter-spacing:2px;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btns button{font-size:15px}
#title{background:linear-gradient(180deg,rgba(28,22,38,.0) 30%,rgba(28,22,38,.55));place-items:end start;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#title .wrap{max-width:560px}
#title h1{margin:0;font-family:var(--fancy);font-size:54px;line-height:.9;color:var(--paper);text-shadow:4px 4px 0 var(--ink);font-weight:400}
@media (min-width:700px) and (min-height:420px){#title h1{font-size:81px}}
#title .tag{font-family:var(--mono);font-size:15px;letter-spacing:.06em;margin:8px 0 14px;text-shadow:2px 2px 0 var(--ink)}
.list{display:grid;gap:8px;margin:4px 0 12px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff6e4;border:2px solid var(--paper2);padding:8px 10px;text-align:left;width:100%;box-shadow:none;color:var(--ink)}
.item b{display:block;font-size:17px}
.item span.d{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.25}
.item .r{font-family:var(--mono);font-size:14px;white-space:nowrap;color:var(--ink2)}
.item.done{border-color:var(--good)}
.chk{font-family:var(--mono);font-size:17px;width:18px;text-align:center}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:2px dashed var(--paper2)}
.tog b{font-size:16px}.tog span{display:block;font-size:13px;color:var(--ink2)}
.tog button{font-family:var(--mono);font-size:15px;min-width:58px}
.tog button.on{background:var(--good);color:#fff;box-shadow:inset -3px -3px 0 #3e7334, 0 3px 0 #0007}
h3{font-family:var(--mono);font-size:15px;letter-spacing:.08em;color:var(--ink2);margin:12px 0 6px}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}

.num{font-family:'VT323',ui-monospace,monospace;font-size:1.22em;line-height:1;letter-spacing:.02em}
</style>

<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div id="flightUI" hidden>
  <div id="top">
    <div class="pill" id="spd">0<small>KT</small></div>
    <button id="dest" aria-label="Change destination"><span class="arr" id="arr">▲</span><span id="destTxt">—</span></button>
    <div class="sp"></div>
    <div class="pill" id="alt">0<small>FT</small><span id="vsi"></span></div>
    <button id="center" aria-label="Recenter tilt" hidden>CENTER</button>
    <button id="radioBtn" aria-label="Radio station"></button>
    <button id="todBtn" aria-label="Time of day"></button>
    <button id="view" aria-label="Change view">CHASE</button>
    <button id="pause" aria-label="Pause">II</button>
  </div>
  <div id="stallBan" hidden>STALL</div>
  <div id="callout" hidden></div>
  <div id="thr" aria-label="Throttle lever"><b class="lab">THROTTLE</b><div id="thrSlot"></div><div id="thrTicks"></div><div id="thrKnob"></div><span id="thrPct">0%</span></div>
  <div id="rail">
    <button class="rb on" id="rMap" aria-label="Show or hide the map"></button>
    <button class="rb on" id="rJob" aria-label="Show or hide today's jobs"></button>
    <button class="rb on" id="rEng" aria-label="Show or hide the landing controls"></button>
    <button class="rb on" id="rFun" aria-label="Show or hide the light, smoke, float and radio switches"></button>
    <button class="rb" id="rDrop" aria-label="Show or hide the air-drop controls" hidden></button>
    <button id="wind" aria-label="Tailwind boost"></button>
  </div>
  <div id="pcol"><canvas id="mapc" width="96" height="96" aria-label="Map. Tap for the full chart."></canvas>
    <div id="job" aria-label="Today's jobs. Tap for the mail bag."><div class="jh"><span id="jDay">FREE FLIGHT</span><span id="score" aria-label="Score">★ 0</span></div><div id="bag" hidden></div><div id="jDrop" hidden></div><div id="errand" hidden></div></div></div>
  <div id="eng">
    <button id="brake"><b class="lab">BRAKE</b><span class="ped"></span></button>
    <div id="flapL" aria-label="Flap lever"><b class="lab">FLAPS</b><div class="fslot"></div><span class="fd" data-f="0">0</span><span class="fd" data-f="1">1</span><span class="fd" data-f="2">2</span><div id="flapH"></div></div>
    <button class="tsw" id="swCarb"><b class="lab">CARB HT</b><span class="nut"></span><span class="bat"></span><em class="u">ON</em><em class="d">OFF</em></button>
    <button class="tsw" id="swMix"><b class="lab">MIX</b><span class="nut"></span><span class="bat"></span><em class="u">RICH</em><em class="d">LEAN</em></button>
    <button class="tsw" id="swLight"><b class="lab">LAND LT</b><span class="nut"></span><span class="bat"></span><em class="u">ON</em><em class="d">OFF</em></button>
  </div>

const ARCH=[

     const [u,v]=locUV(this,x,z),hi=smooth(-150,0,u)*smooth(.08,.25,m),gul=Math.exp(-(((v-60-u*.08)/70)**2))*smooth(-120,350,u);

  {id:'lantern',name:'Lantern Key',x:6300,z:7700,r:900,rot:.9,h(x,z){const m=iblob(x,z,this,800,430,.2,281);if(m<0)return sea(m*1.3);const t=smooth(0,.4,m);
     return t*5+(fbm(x*.003,z*.003,3,283)*.5+.5)*10*t;}},
  {id:'quarry',name:'Greystone',x:-3800,z:-8300,r:950,rot:.1,h(x,z){const m=iblob(x,z,this,860,700,.2,291);if(m<0)return sea(m);const t=smooth(0,.3,m);
     const [u,v]=locUV(this,x,z),base=t*24+130*Math.exp(-((u+60)**2+(v-60)**2)/(2*330*330))*t+(fbm(x*.003,z*.003,3,293)*.5+.5)*20*t;
     const pr=Math.hypot(u-120,v+40)/260;if(pr>1)return base;const step=26+Math.floor(pr*7)*12+smooth(0,.25,(pr*7)%1)*12*0;return Math.min(base,lerp(step,base,smooth(.85,1,pr)));}},

     const [u,v]=locUV(this,x,z);return t*14+150*Math.exp(-(((v+70)/150)**2))*t*smooth(-1250,-700,u)*smooth(1250,700,u)+(fbm(x*.003,z*.003,3,303)*.5+.5)*14*t;}},

];

  const h=s.hdg*DEG; s.fx=Math.sin(h); s.fz=-Math.cos(h); s.rx=Math.cos(h); s.rz=Math.sin(h);
  let sum=0,n=0; for(let i=-4;i<=4;i++){sum+=naturalH(s.x+s.fx*i*s.len/8,s.z+s.fz*i*s.len/8);n++;}
  s.elev=Math.max(4,sum/n);

function finalH(x,z){

    const ds=Math.max(Math.abs(l.s)-s.len/2-45,0), dt=Math.max(Math.abs(l.t)-s.wid/2-30,0);
    const w=1-smooth(0,150,Math.hypot(ds,dt)); h=lerp(h,s.elev,w);}
  return h;
}

  const i=Math.floor(gx),j=Math.floor(gz),fx=gx-i,fz=gz-j;
  const a=hAt(i,j),b=hAt(i+1,j),c=hAt(i,j+1),d=hAt(i+1,j+1);

const SOLIDS=[];   // simple collision shapes for rock spires, arches and bridges: c = tapered cylinder, s = sphere
const FLYGATES=[]; // natural gaps worth flying through: a vertical window with a normal (nx,nz) and half-width w
const FINDS={};    // errand items: set id -> [{x,y,z}]
const solidCyl=(x,z,y0,y1,r0,r1)=>SOLIDS.push({k:'c',x,z,y0,y1,r0,r1});
const solidSph=(x,y,z,r)=>SOLIDS.push({k:'s',x,y,z,r});
function propHit(x,y,z,pad=1.2){for(const o of SOLIDS){if(o.k==='c'){if(y<o.y0||y>o.y1)continue;const r=lerp(o.r0,o.r1,(y-o.y0)/(o.y1-o.y0))+pad;if((x-o.x)**2+(z-o.z)**2<r*r)return true;}
  else if((x-o.x)**2+(y-o.y)**2+(z-o.z)**2<(o.r+pad)**2)return true;}return false;}
function flyGate(id,name,x,z,y0,y1,yaw,w,desc){FLYGATES.push({id,name,x,z,y0,y1,nx:Math.cos(yaw),nz:Math.sin(yaw),w,desc});}

  for(let k=0;k<n;k++){const a=k/n,b=(k+1)/n,ya=lerp(y0,top,a),yb=lerp(y0,top,b),ra=lerp(r0,r1,a),rb=lerp(r0,r1,b);

/* ---------- Bea's logbook (flight guide) ---------- */
const BEA=[
  {t:'The two thumbs',h:`<p>Left thumb is the throttle. Right thumb is the stick: touch anywhere on the right side and drag.</p><ul><li><b>Drag down</b> to raise the nose. <b>Drag up</b> to lower it.</li><li><b>Drag sideways</b> to bank. Banking is how you turn.</li><li>The rudder looks after itself while Steady Wings is on.</li></ul><p>Small moves. The plane does what you ask, just a moment later than you'd like.</p>`},
  {t:'Pitch and power',h:`<p>Here's the secret most new pilots fight: <b>the stick sets your speed, the throttle sets climb or descent.</b></p><ul><li>Nose up, slower. Nose down, faster.</li><li>Want to climb without slowing down? Add power.</li><li>Want to come down without speeding up? Take power off.</li></ul><p>Let go of the stick and the plane holds the speed you left it at. That's Auto-trim, doing what a real pilot does with the trim wheel.</p>`},
  {t:'Flaps',h:`<p>Flaps are hinged panels on the back of the wing. Lowering them makes the wing curvier: more lift, and also more drag.</p><table><tr><td>FLAPS 0</td><td><b>Cruise.</b> Clean wing, least drag. Climbing out and flying around.</td></tr><tr><td>FLAPS 1</td><td><b>Takeoff and approach.</b> A bit more lift, so you can fly a few knots slower. Good for short strips and the start of an approach.</td></tr><tr><td>FLAPS 2</td><td><b>Landing.</b> Most lift and most drag. You can come down steeply without speeding up, and touch down slow.</td></tr></table><p>Don't fly fast with flaps out: above 85 knots (the top of the white arc on the speed gauge) they're working too hard. With flaps down you need more power to hold your height.</p>`},
  {t:'The six gauges',h:`<table><tr><td>SPEED</td><td>Airspeed in knots. White arc: flap range. Green: normal. Yellow: careful, smooth air only.</td></tr><tr><td>ATTITUDE</td><td>Blue is sky, brown is ground. The orange wings are you. Shows bank and nose up or down, even when you can't see outside.</td></tr><tr><td>ALTITUDE</td><td>Height in feet above the sea. The long needle is hundreds, the short one thousands. (The readout at the top of the screen is height above the ground, which matters more for landing.)</td></tr><tr><td>HEADING</td><td>Your compass direction. The cyan mark is the way to your next stop.</td></tr><tr><td>CLIMB</td><td>Feet per minute up or down. On approach, about 400 down is right.</td></tr><tr><td>RPM</td><td>Engine speed. The green band is cruise power.</td></tr></table><p>Trick: glance, don't stare. Speed, attitude, back to the window.</p>`},
  {t:'Taking off',h:`<ul><li>Flaps 0 on a long runway, 1 on a short one.</li><li>Full power. Keep straight with small sideways stick.</li><li>At about 45 knots, drag the stick gently down. The nose lifts and the plane flies itself off.</li><li>Climb at 55 to 65 knots. Let go and it holds that.</li><li>Flaps up once you're well above the trees.</li></ul>`},
  {t:'Turning',h:`<p>Bank to turn. The steeper the bank, the faster the turn, but the wing spends some of its lift turning instead of holding you up.</p><ul><li>In a turn, hold the stick a little down (back) to keep the nose up and stay level.</li><li>Gentle turns are about 20 degrees of bank. Thirty is brisk.</li><li>Let go of the stick and Steady Wings rolls you level.</li></ul>`},
  {t:'The approach',h:`<p>A good landing is made two kilometers out.</p><ul><li>On the chart, the runway you're headed for has a <b>dashed line</b> coming out of each end. Fly to that line, then turn to follow it toward the runway.</li><li>About 2 km out and a few hundred feet up: <b>flaps 1</b>, power back, <b>55 knots</b>.</li><li>Watch the <b>four lights</b> beside the runway. Two white and two red: perfect. More white: too high, take off power. More red: too low, add power.</li><li>Closer in: flaps 2, and keep the runway centered in the windshield.</li><li>Do your before-landing checklist.</li></ul>`},
  {t:'Landing numbers',h:`<p>Pin these on your knee. The speed and height readouts turn <b style="color:#3e7334">green</b>, <b style="color:#b8862a">amber</b> or <b style="color:#c2453a">red</b> on approach to tell you how you're doing.</p><table><tr><td>2 KM OUT</td><td><b>Gate 1</b>, about <b>450 ft up</b>, lined up on the dashed line, flaps 1, <b>55 knots</b>. Start heading for it from 4 or 5 km away so you have time to turn in.</td></tr><tr><td>GATES 2 AND 3</td><td>1.3 km (about 300 ft) and 0.7 km (about 160 ft). Keep the diamond in the ring on the line-up meter.</td></tr><tr><td>ON FINAL</td><td><b>50 to 60 knots.</b> Coming down about <b>400 ft/min</b>. Two white and two red lights.</td></tr><tr><td>OVER THE END</td><td>Flaps 2, power to idle, <b>about 50 knots</b>, 30 to 50 ft up.</td></tr><tr><td>FLARE</td><td>At <b>10 to 20 ft</b>, ease the nose up a little. The meter switches to FLARE: put both markers in the green, <b>nose up 2 to 8°</b> and <b>sink under 300 ft/min</b>.</td></tr><tr><td>TOUCHDOWN</td><td>Wings level (<b>under 10°</b> of bank), nose slightly up, about <b>45 to 50 knots</b>.</td></tr></table><p>The height readout is <b>feet above the ground under you</b>, not above the sea. Trees are about 30 to 45 ft tall; a house is about 20. Near the runway you'll hear little beeps at 100, 50, 30, 20 and 10 ft.</p><p>Over 800 ft/min at touchdown and Gus gets a phone call.</p>`},
  {t:'Landing and stopping',h:`<ul><li>Aim at the white markers about a quarter of the way down the runway.</li><li>Just above the runway, <b>ease the stick down (back)</b> to raise the nose a little. This is the flare: it turns a drop into a settle.</li><li>Power to idle as the wheels touch.</li><li>Hold <b>BRAKE</b>. It builds up the longer you hold: tap it for a little, hold it for a lot.</li></ul><p>Under 180 ft/min is soft. Under 90 is butter.</p>`},
  {t:'Stalls',h:`<p>A wing can only meet the air so steeply. Push past that and it stalls: it stops lifting, and the nose drops.</p><ul><li>The horn and the red STALL sign mean you're close.</li><li><b>Fix it: lower the nose.</b> Speed comes back, the wing works again. Then add power.</li><li>Slow, steep and turning is where stalls happen. On approach, watch the speed.</li></ul><p>Stall Guard stops you pulling into one. Turn it off in Settings when you want to feel it.</p>`},
  {t:'Before-landing checklist',h:`<p>I did this every single landing for forty years. Four things:</p><table><tr><td>CARB HEAT</td><td>ON. Low power on approach is when carb ice forms.</td></tr><tr><td>MIXTURE</td><td>RICH, so full power is there if you need to go around.</td></tr><tr><td>FLAPS</td><td>1 or 2.</td></tr><tr><td>LANDING LIGHT</td><td>ON at sunset, blue hour and night.</td></tr></table><p>The checklist box shows up on approach. Land with all of it done and Mabel adds a bonus stamp.</p>`},
  {t:'Carb heat and mixture',h:`<p><b>Carb ice.</b> The carburetor mixes fuel and air, and it gets cold inside, cold enough to freeze damp air. At low power it can ice up and the engine runs rough and weak. CARB HEAT warms the air going in and melts it, at the cost of a little power. Running rough on a long descent? Carb heat on.</p><p><b>Mixture.</b> Higher up the air is thinner, so the engine wants less fuel. Leaning (MIX LEAN) above 2,000 ft gives a little more power. Down low, lean means too little fuel: keep it RICH.</p>`},
  {t:'Flying by the gauges',h:`<p>In cloud or fog you can't trust your body; it will swear you're level when you're turning. Trust the attitude gauge.</p><ul><li>Keep the orange wings level on the horizon line.</li><li>On approach, the <b>line-up meter</b> at the top: the diamond is where the path is. Fly gently toward it until it sits in the ring.</li></ul>`},
  {t:'Air drops',h:`<p>Some folk camp out too far from a runway for the mail. For them we drop parcels on little parachutes.</p><ul><li>When you load the bag, Mabel may hand you one, two or three air drops. She'll only know which <b>island</b> they're on, so it's a dashed circle on the chart. Keep a lookout for <b>orange smoke</b>: under it is a painted <b>bullseye</b> and someone waving.</li><li>Tap the <b>target</b> button on the left to bring up LOOK DOWN and DROP.</li><li>Fly over low and steady, 300 to 400 ft up. With LOOK DOWN on, the <b>crosshair is where the parcel lands</b> if you let go now. It falls a long way forward, so let go well before you're over the rings.</li><li>The moment it's out you'll be told if it's heading for the rings or going wide, and which way. The chute pops low, so it's down in a few seconds.</li><li>A good drop: they cheer, and the camp packs itself up. Land at any field for more parcels.</li></ul>`},
  {t:'Night flying',h:`<ul><li>Runways have edge lights at night. Amber ones mark the ends.</li><li>Turn on your landing light on approach: it lights the runway in front of you.</li><li>The approach lights work just the same at night, so trust them over your eyes.</li><li>Some things on the islands only show themselves after dark. Go looking at blue hour or night: a few of them glow.</li></ul>`},
];
function bea(i){if(mode==='fly')mode='paused';const p=BEA[i];
  if(i<0){const list=BEA.map((b,j)=>`<button class="item" data-p="${j}"><span><b>${j+1}. ${b.t}</b></span><span class="r">READ</span></button>`).join('');
    showCard(`<div class="who"><img src="${portrait('bea')}" alt=""><div><b>Bea's logbook</b><span>FORTY YEARS OF FLYING THIS ROUTE</span></div></div><div class="list">${list}</div>`,[['Back',back,true]]);
    $('cardBody').querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>bea(+b.dataset.p)));return;}
  showCard(`<div class="page"><div class="sub">BEA'S LOGBOOK · PAGE ${i+1} OF ${BEA.length}</div><h2>${p.t}</h2>${p.h}</div>`,[
    ['All pages',()=>bea(-1)],...(i>0?[['Previous',()=>bea(i-1)]]:[]),...(i<BEA.length-1?[['Next page',()=>bea(i+1),true]]:[['Done',back,true]])]);}

// A real script font drawn small on a canvas and scaled up with square pixels. Swap SCRIPT to try another hand.
const SCRIPT={family:'Dancing Script',weight:700};const PXC={};let scriptReady=false;

  const c=document.createElement('canvas'),x=c.getContext('2d'),font=`${SCRIPT.weight} ${px}px "${SCRIPT.family}"`;x.font=font;

  if(shadow){x.fillStyle=shadow;x.fillText(txt,x0+1,y+1);}x.fillStyle=col;x.fillText(txt,x0,y);
  const d=x.getImageData(0,0,c.width,c.height);for(let i=3;i<d.data.length;i+=4)d.data[i]=d.data[i]>105?255:0;x.putImageData(d,0,0);

/* numbers in running text use VT323, whose digits can't be mistaken for letters */
function fixNums(root){const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/\d/.test(n.nodeValue)&&!(n.parentElement&&n.parentElement.closest('.num,.k,.sub,.got,button,script,style'))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const list=[];while(tw.nextNode())list.push(tw.currentNode);
  for(const n of list){const f=document.createDocumentFragment();let last=0;const s=n.nodeValue;s.replace(/\d+(?:[.,:]\d+)*(?:[–-]\d+(?:[.,:]\d+)*)?/g,(m,i)=>{if(i>last)f.appendChild(document.createTextNode(s.slice(last,i)));const sp=document.createElement('span');sp.className='num';sp.textContent=m;f.appendChild(sp);last=i+m.length;return m;});
    if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));n.parentNode.replaceChild(f,n);}}

function drawHUD(dt){

function approachMeter(){

let camLow=0;const camPos=new V3(),_c1=new V3(),_c2=new V3(),_c3=new V3(),tiltQ=new Q().setFromAxisAngle(new V3(1,0,0),-12*DEG);

    if(!inside&&nd.dist<6000&&nd.d.seen){const a=Math.atan2(nd.d.x-ac.pos.x,-(nd.d.z-ac.pos.z))-Math.atan2(_f.x,-_f.z),ex=cx+Math.sin(a)*(LW*.42),ey=cy-Math.cos(a)*(LH*.4);
      pb.disc(Math.round(ex),Math.round(ey),3,K);pb.disc(Math.round(ex),Math.round(ey),2,C.orange);txt(nd.dist<1000?Math.round(nd.dist/10)*10+' M':(nd.dist/1000).toFixed(1)+' KM',Math.round(ex),Math.round(ey)+5,C.orange);}

/* ---------- the fun switches: things you flick that change the world around you ----------
   MIC          pilot-controlled runway lights, like real quiet airfields: key the mic 3 times fast for low, 5 for medium,
                7 for bright. The nearest field's edge lights come on, running down the runway, for 15 minutes.
   SMOKE        airshow smoke: a white trail that hangs in the air and drifts with the wind, so you can draw in the sky.
   SEARCHLIGHT  a narrow sBeam under the nose that swings into your turns (and drifts gently side to side),
                so banking paints it across the ground.
   FLOATS       a red pull handle. Two inflatable floats pop out like a life raft and you can land on the water. */

/* ---- runway lights ---- */
const RWY={};
for(const s of STRIPS){const L=RWY_L[s.id];if(!L)continue;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(L.p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(L.c,3));
  const m=new THREE.Points(g,new THREE.PointsMaterial({size:2,sizeAttenuation:false,vertexColors:true,fog:false}));m.frustumCulled=false;m.visible=false;g.setDrawRange(0,0);scene.add(m);

const RWY_ON=900,LEVELS=['','LOW','MEDIUM','HIGH'];

function lightStrip(s,level,quiet){const r=RWY[s.id];if(!r)return;const was=r.level;r.level=Math.max(level,1);r.until=simT+RWY_ON;if(!was)r.on=0;
  r.m.material.size=r.level>=3?3:2;r.m.material.color.setScalar(1);if(!quiet){snd.clunk();toast(`${s.name}: runway lights ${LEVELS[r.level]}. They stay on for 15 minutes.`,2.6);}}
let micN=0,micT=0;
function keyMic(){if(mode!=='fly')return;micN++;micT=1.6;snd.squelch();updMicUI();}

  const near=STRIPS.reduce((a,s)=>Math.hypot(s.x-ac.pos.x,s.z-ac.pos.z)<Math.hypot(a.x-ac.pos.x,a.z-ac.pos.z)?s:a);
  if(Math.hypot(near.x-ac.pos.x,near.z-ac.pos.z)>12000){toast('Nothing answers. No airfield in radio range.',2);return;}
  lightStrip(near,lvl);if(TOD[tod].lights<=0)tip('micday','The runway lights are on, but you\'ll only really see them from sunset on.');}
function updMicUI(){const b=$('micBtn');if(b)b.querySelector('em').textContent=micN?'●'.repeat(Math.min(micN,7)):'×3';}
function updRunwayLights(dt){const dark=TOD[tod].lights>0;
  if(micT>0){micT-=dt;if(micT<=0)micDone();}
  for(const s of STRIPS){const r=RWY[s.id];if(!r)continue;if(r.level&&simT>r.until)r.level=0;
    const want=r.level&&dark;r.on=want?Math.min(1,r.on+dt/.8):0;r.m.visible=want;if(want)r.m.geometry.setDrawRange(0,Math.ceil(r.n*r.on));}
  if(dark&&mode==='fly'&&!ac.ground&&dest&&!rwyLit(dest)&&Math.hypot(dest.x-ac.pos.x,dest.z-ac.pos.z)<5000)
    tip('pcl','Dark runway? Little airfields have pilot-controlled lights. Tap MIC three times quickly (five for brighter, seven for brightest) and the nearest runway lights up.');}

/* ---- smoke trail ---- */
const SMOKE_N=520,SMOKE_LIFE=42,SMOKE_EVERY=.08;let smokeOn=false,smokeAcc=0,smokeI=0;
const smokeTrail=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1,0),new THREE.MeshLambertMaterial({color:0xf4f0ea}),SMOKE_N);smokeTrail.frustumCulled=false;scene.add(smokeTrail);
const SMK=Array.from({length:SMOKE_N},()=>({t:-1,p:new V3(),v:new V3(),r:Math.random()*TAU}));
const _tail=new V3(),_tm=new THREE.Matrix4(),_tq=new THREE.Quaternion(),_ts=new V3();
for(let i=0;i<SMOKE_N;i++)smokeTrail.setMatrixAt(i,_tm.makeScale(0,0,0));
function updSmoke(dt){
  if(smokeOn&&mode==='fly'&&!ac.ground&&ac.ias>10){smokeAcc+=dt;while(smokeAcc>=SMOKE_EVERY){smokeAcc-=SMOKE_EVERY;const q=SMK[smokeI];smokeI=(smokeI+1)%SMOKE_N;
    q.t=0;q.p.copy(_tail.set(0,.2,4.8).applyQuaternion(ac.q).add(ac.pos)).addScaledVector(ac.vel,-smokeAcc);q.v.copy(WIND).multiplyScalar(.6);q.v.y=.25;}}

  if(any)smokeTrail.instanceMatrix.needsUpdate=true;}

/* ---- searchlight ---- */
let searchOn=false;
const sLight=new THREE.SpotLight(0xf4f6ff,0,1100,.075,.35,1);sLight.position.set(0,-.6,-1.5);plane.add(sLight);const sTarget=new THREE.Object3D();scene.add(sTarget);sLight.target=sTarget;
const beamGeo=new THREE.ConeGeometry(Math.tan(.075),1,14,1,true).translate(0,-.5,0);
const sBeam=new THREE.Mesh(beamGeo,new THREE.MeshBasicMaterial({color:0xe8eeff,transparent:true,opacity:.08,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));sBeam.visible=false;sBeam.renderOrder=5;scene.add(sBeam);
const _so=new V3(),_sd=new V3(),_sh=new V3(),_srt=new V3(),_down=new V3(0,-1,0);let sweepT=0;
function updSearch(dt){const on=searchOn&&mode!=='title';sLight.intensity=on?(TOD[tod].lights>0?3.2:.6):0;sBeam.visible=on&&TOD[tod].lights>0;if(!on)return;
  axes();sweepT+=dt;const bank=ac.ground?0:Math.atan2(-_r.y,_u.y);
  _sh.set(_f.x,0,_f.z);if(_sh.lengthSq()<1e-4)_sh.set(0,0,-1);_sh.normalize();_srt.set(-_sh.z,0,_sh.x);

  _sd.copy(_sh).multiplyScalar(1).addScaledVector(_down,ac.ground?.08:.75).addScaledVector(_srt,side).normalize();
  const o=_so.copy(sLight.position);plane.localToWorld(o);let L=900;for(let d=20;d<900;d+=15){const x=o.x+_sd.x*d,y=o.y+_sd.y*d,z=o.z+_sd.z*d;if(y<surfH(x,z)){L=d;break;}}

  sBeam.position.copy(o);sBeam.quaternion.setFromUnitVectors(_down,_sd);sBeam.scale.set(L,L,L);sBeam.material.opacity=.07*TOD[tod].lights;}

/* ---- inflatable floats ---- */
ac.floats=0;let floatsOn=false;
const floatG=new THREE.Group();floatG.visible=false;plane.add(floatG);
{const parts=[];for(const sd of [-1,1]){const x=sd*1.45;
  parts.push({geo:new THREE.CylinderGeometry(.46,.46,4.4,10).rotateX(Math.PI/2),m:M([x,0,-.3]),color:0xf0a03a},
    {geo:new THREE.SphereGeometry(.46,10,6),m:M([x,0,-2.5],[0,0,0],[1,1,1.5]),color:0xf0a03a},{geo:new THREE.SphereGeometry(.46,10,6),m:M([x,0,1.9]),color:0xf0a03a},
    {geo:new THREE.CylinderGeometry(.475,.475,.22,10).rotateX(Math.PI/2),m:M([x,0,-1.2]),color:0xf4efe2},{geo:new THREE.CylinderGeometry(.475,.475,.22,10).rotateX(Math.PI/2),m:M([x,0,.7]),color:0xf4efe2},

  const fm=new THREE.Mesh(merge(parts),toon());fm.position.y=-1.8;floatG.add(fm);}
const FLOAT_H=.75;   // how much higher the plane sits on its floats
const floatLift=()=>FLOAT_H*ac.floats;

  if(!on&&ac.ground&&groundH(ac.pos.x,ac.pos.z)<.3){toast('Not while you\'re floating on them!',2);updFunUI();return;}

  floatG.visible=ac.floats>.01;if(floatG.visible){const u=ac.floats,v=u-1,s=floatsOn?1+2.7*v*v*v+1.7*v*v:u;floatG.scale.set(Math.max(.05,s),Math.max(.05,s),.3+.7*Math.min(1,u*1.5));}}

/* ---- the panel ---- */

$('swSearch').addEventListener('click',()=>{searchOn=!searchOn;snd.flick();updFunUI();if(searchOn)tip('search','Searchlight on. Bank and it swings into the turn, so you can sweep it across the ground. Best after dark.');});

updFunUI();


/* ---------- main loop ---------- */
let acc=0,last=performance.now(),fpsN=0,fpsT=0,fpsLast=0,fpsPrev=0,fpsMin=999;renderer.info.autoReset=false;
function loop(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;const t=now/1000;
  skyMat.uniforms.uTime.value=t;waterMat.uniforms.uTime.value=t;for(const a of anims)a(t);
  cloudGroup.position.set((t*2.2)%4000,0,-(t*.8)%4000);
  {const pu=postMat.uniforms;pu.mist.value=lerp(pu.mist.value,cloudMist(camera.position),1-Math.exp(-dt*5));pu.mistC.value.copy(scene.fog.color).lerp(_mistW,.3);}
  if(mode==='fly'){readInput(dt);acc+=dt;const H_=1/120;let n=0;while(acc>=H_&&n<10){if(ac.ground)stepGround(H_);else{stepAir(H_);stepBoost(H_);stepBumps(H_);}simT+=H_;acc-=H_;n++;if(mode!=='fly')break;}if(n>=10)acc=0;
    if(!Number.isFinite(ac.pos.x+ac.pos.y+ac.pos.z+ac.vel.x+ac.vel.y+ac.vel.z+ac.q.x+ac.q.w)){console.warn('sim NaN, respawning');spawnField(stripById(ac.lastField)||STRIPS[0]);}
    if(mode==='fly'){gameChecks(dt);playChecks(dt);}runTips(dt);}
  else acc=0;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}
  if(callT>0){callT-=dt;if(callT<=0)$('callout').hidden=true;}
  updateVisuals(dt,t);updateCam(dt,t);cullChunks(camera.position);sky.position.copy(camera.position);
  renderer.info.reset();renderer.setRenderTarget(rt);renderer.render(scene,camera);const tri=renderer.info.render.triangles,dc=renderer.info.render.calls;renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  drawHUD(dt);
  if(settings.fps){fpsN++;fpsT+=now-(fpsLast||now);fpsLast=now;fpsMin=Math.min(fpsMin,1000/Math.max(now-(fpsPrev||now-16),1));fpsPrev=now;
    if(fpsT>=500){$('fps').textContent=`${Math.round(fpsN*1000/fpsT)} FPS · LOW ${Math.round(fpsMin)} · ${(tri/1e6).toFixed(2)}M TRI · ${dc} DRAWS · ${LW}×${LH}`;fpsN=0;fpsT=0;fpsMin=999;}}
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{resize();setThrottleUI();placeRingIdle();checkRotate();});
$('wind').addEventListener('click',e=>{e.stopPropagation();useWind();});pixMode=settings.pixels;resize();setTOD(settings.light);toTitle();placeRingIdle();checkRotate();refreshBag();applyPanels();
updScore();updErrandUI();updTodBtn();updRadioBtn();$('lookBtn').addEventListener('click',e=>{e.stopPropagation();toggleLook();});$('dropBtn').addEventListener('click',e=>{e.stopPropagation();doDrop();});updParcelUI();$('radioBtn').addEventListener('click',e=>{e.stopPropagation();turnDial();});const ld=$('load');if(ld)ld.hidden=true;$('fps').hidden=!settings.fps;$('fps').textContent='FPS: measuring…';
