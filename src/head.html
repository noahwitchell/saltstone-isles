<title>Saltwhistle Skies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: full-bleed pixel render; flight data along the top edge, throttle under the left thumb, stick zone under the right thumb; paper-card overlays for menus. One committed dusk-arcade look. */
:root{
  --ink:#241c2e; --ink2:#4a3d55; --paper:#f5e8cf; --paper2:#e3cda4; --accent:#e2703f; --accent2:#b5512b;
  --good:#5c9e4f; --warn:#f1c84a; --bad:#e5483b; --glass:rgba(36,28,46,.74); --line:#5a4a63;
  --display:'Pixelify Sans','VT323',ui-monospace,monospace; --fancy:'Jacquarda Bastarda 9','Pixelify Sans',serif; --mono:'VT323',ui-monospace,monospace;
  --sl:max(10px, env(safe-area-inset-left, 0px)); --sr:max(10px, env(safe-area-inset-right, 0px));
  --st:calc(6px + env(safe-area-inset-top, 0px)); --sb:calc(8px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
[hidden]{display:none!important}
/* turned 90 degrees when the phone is upright, so the game is always landscape. Safe-area insets swap sides to match */
html.rot body{position:fixed;left:0;top:0;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
html.rot{--sl:max(10px, env(safe-area-inset-top, 0px));--sr:max(10px, env(safe-area-inset-bottom, 0px));--st:calc(6px + env(safe-area-inset-right, 0px));--sb:calc(8px + env(safe-area-inset-left, 0px))}
html,body{height:100%;margin:0;background:#1f1a2b;color:var(--paper);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--display)}
#gl,#hud{position:fixed;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated}
#hud{pointer-events:none}
button{font:inherit;color:var(--ink);background:var(--paper);border:0;border-radius:0;padding:8px 12px;cursor:pointer;touch-action:manipulation;
  box-shadow:inset -3px -3px 0 var(--paper2), 0 3px 0 #0007}
button:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 var(--paper2), 0 1px 0 #0007}
button.primary{background:var(--accent);color:#fff8ec;box-shadow:inset -3px -3px 0 var(--accent2), 0 3px 0 #0007}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* flight HUD */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:var(--st) var(--sr) 0 var(--sl);pointer-events:none}
.pill{pointer-events:auto;font-family:var(--mono);font-size:21px;line-height:1;background:var(--glass);color:var(--paper);padding:7px 9px;border:2px solid var(--line);
  box-shadow:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:13px;opacity:.75;margin-left:3px}
#spd.warn{background:var(--bad);border-color:#ffb0a0}
.pill.ok{background:rgba(52,110,48,.85);border-color:#8fe08a}.pill.caution{background:rgba(170,120,30,.9);border-color:#f1c84a}
#vsi.ok{color:#8fe08a}#vsi.caution{color:#f1c84a}#vsi.bad{color:#ff8a7a}
#callout{z-index:5;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:42px;color:var(--paper);text-shadow:3px 3px 0 var(--ink);pointer-events:none}
#vsi{font-size:15px;margin-left:6px;opacity:.9}
#dest{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:8px 10px;color:var(--paper);background:var(--glass);border:2px solid var(--line);box-shadow:none}
#dest .arr{display:inline-block;width:12px;text-align:center;color:#6fe0e0;margin-right:4px}
.sp{flex:1;display:flex;justify-content:center;min-width:0}
#task{pointer-events:auto;font-family:var(--mono);font-size:15px;line-height:1;padding:5px 9px;background:var(--glass);border:2px solid var(--line);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;gap:6px;align-items:center}
#task img{width:14px;height:14px;image-rendering:pixelated;flex:none}
#task b{color:#ffd36b}#task .dim{opacity:.7}
#todBtn,#radioBtn{pointer-events:auto;padding:3px 5px;line-height:0}#todBtn img,#radioBtn img{width:32px;height:32px;image-rendering:pixelated;display:block}
#view,#pause,#center{pointer-events:auto;font-family:var(--mono);font-size:15px;padding:8px 10px}
#stallBan{z-index:5;position:fixed;left:50%;top:calc(var(--st) + 44px);transform:translateX(-50%);font-family:var(--mono);font-size:20px;background:var(--bad);color:#fff;padding:5px 12px;letter-spacing:.1em;pointer-events:none}
#toast{z-index:26;white-space:pre-line;position:fixed;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);max-width:min(520px,52vw);background:var(--paper) var(--paperTex);background-size:192px 192px;box-shadow:inset 0 0 7px rgba(110,62,18,.36),inset 0 0 22px rgba(130,82,30,.22);color:var(--ink);padding:9px 13px;font-size:15px;line-height:1.3;
  box-shadow:4px 4px 0 #0008;pointer-events:none;text-align:center;text-wrap:balance}


/* controls: an analog panel. Throttle quadrant lever on the left, a rail of little toggle buttons beside it, and
   panels (map, today's jobs, landing controls, air drop) that fold away so you can just look at the view */
#thr{position:fixed;left:var(--sl);top:calc(var(--st) + 50px);bottom:calc(var(--sb) + 106px);width:58px;touch-action:none;z-index:2;
  background:linear-gradient(90deg,#3b3542,#2c2733 45%,#24202b);border:2px solid #15121a;box-shadow:inset 2px 2px 0 #4d4656,inset -2px -2px 0 #1a161f}
#thr .lab{position:absolute;left:0;right:0;top:4px;text-align:center;font:9px/1 var(--mono);letter-spacing:.08em;color:#cfc4b2}
#thrSlot{position:absolute;left:50%;top:22px;bottom:36px;width:8px;margin-left:-4px;background:#0d0b10;box-shadow:inset 2px 0 0 #000,1px 0 0 #4d4656}
#thrTicks{position:absolute;right:4px;top:22px;bottom:36px;width:6px;background:repeating-linear-gradient(#cfc4b2 0 1px,transparent 1px 10%)}
#thrKnob{position:absolute;left:3px;right:3px;height:24px;bottom:calc(36px + var(--t,0) * (100% - 58px));transform:translateY(50%);border-radius:7px 7px 4px 4px;
  background:linear-gradient(#55505c,#18151c 40%,#0b090d);box-shadow:inset 0 2px 0 #8a8492,0 3px 0 #000a;pointer-events:none}
#thrKnob::after{content:'';position:absolute;left:6px;right:6px;top:9px;height:2px;background:#e2703f}
#thrPct{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--mono);font-size:14px;color:#ffd36b}
#rail{position:fixed;left:calc(var(--sl) + 64px);top:calc(var(--st) + 50px);display:flex;flex-direction:column;gap:4px;z-index:2}
.rb{width:34px;height:34px;padding:2px;line-height:0;background:rgba(28,24,34,.55);box-shadow:inset 0 0 0 1px #4d4656,0 2px 0 #0006;opacity:.6}
.rb img{filter:grayscale(1) brightness(.75)}
.rb img{width:30px;height:30px;image-rendering:pixelated}
/* a panel that is showing: bright cream button, full-color icon, gold edge and a little lit dot */
.rb.on{background:#fff4dc;opacity:1;box-shadow:inset 0 0 0 2px #ffd36b,0 0 8px #ffd36b88,0 2px 0 #0008}.rb.on img{filter:none}
.rb{position:relative}.rb.on::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;background:#5fd35a;box-shadow:0 0 4px #8fe08a}
.rb.nudge{animation:nudge 1s infinite}@keyframes nudge{50%{background:#e2703f;opacity:1}}
#wind{position:fixed;left:var(--sl);bottom:var(--sb);z-index:2;width:58px;height:48px;padding:0;font-family:var(--mono);font-size:10px;line-height:1;color:var(--ink);background:linear-gradient(to top,#ffd36b var(--w,0%),#fff0c4 var(--w,0%));box-shadow:inset -2px -2px 0 #b8902e, 0 2px 0 #0007;pointer-events:auto}
#updraft{position:fixed;left:var(--sl);bottom:calc(var(--sb) + 53px);z-index:2;width:58px;height:48px;padding:0;font-family:var(--mono);font-size:10px;line-height:1;color:var(--ink);background:linear-gradient(to top,#a8dcf4 var(--w,0%),#e4f4fc var(--w,0%));box-shadow:inset -2px -2px 0 #4a8ab0, 0 2px 0 #0007;pointer-events:auto}
#updraft img{width:28px;height:28px;image-rendering:pixelated;display:block;margin:2px auto 1px}#updraft span{display:block;font-size:10px;color:#2a6a9a}#updraft.on{background:#a8dcf4}#updraft.off{opacity:.55}
#wind img{width:28px;height:28px;image-rendering:pixelated;display:block;margin:2px auto 1px}
#wind span{display:block;font-size:10px;color:#a0601e}
#wind.on{background:#ffd36b}
#wind.off{opacity:.55}
#wind.cool{background:linear-gradient(to top,#c9a85a var(--w,0%),#6a5a48 var(--w,0%));color:var(--paper)}
#wind.cool span{color:var(--paper)}
#pcol{position:fixed;left:calc(var(--sl) + 106px);top:calc(var(--st) + 50px);width:124px;display:flex;flex-direction:column;gap:6px;z-index:2}
#mapc{width:124px;height:124px;image-rendering:pixelated;border:2px solid var(--line);background:#1d2a44;display:block;box-sizing:border-box;cursor:pointer}
#job{background:var(--glass);border:2px solid #b8902e;padding:3px 5px 4px;font-family:var(--mono);font-size:13px;line-height:1.15;color:#ffd890;cursor:pointer;pointer-events:auto;width:150px;box-sizing:border-box}
#job .jh{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--paper);opacity:.85;letter-spacing:.04em}
#score{color:#ffd36b}#score.pop{animation:pop .5s}@keyframes pop{30%{transform:scale(1.15);color:#fff}}
#jDrop.done{color:#8fe08a}#jDrop{color:#ff9a6a}
/* landing controls: small separate switches along the bottom, brake right next to the throttle */
#eng{position:fixed;left:calc(var(--sl) + 64px);bottom:var(--sb);display:flex;gap:5px;align-items:flex-end;z-index:2}
.tsw,#brake,#flapL,#micBtn,#hornBtn{position:relative;width:40px;height:58px;padding:0;border-radius:7px;background:rgba(28,24,34,.78);
  box-shadow:inset 0 0 0 1px #5a5266,inset 0 2px 0 #ffffff14,0 2px 0 #0009;touch-action:manipulation}
.tsw:active,#brake:active,#micBtn:active,#hornBtn:active{transform:none}
#hornBtn .bell{position:absolute;left:50%;top:32px;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff2b0,#e0a83a 45%,#8a5a18);box-shadow:0 0 0 1.5px #3a2a10,0 3px 0 #000a}
#hornBtn:active .bell,#hornBtn.honk .bell{transform:translateY(2px);box-shadow:0 0 0 1.5px #3a2a10,0 1px 0 #000a;filter:brightness(1.2)}
.lab{position:absolute;left:-3px;right:-3px;top:4px;text-align:center;font:8px/1 var(--mono);letter-spacing:.02em;color:#d8cebe;white-space:nowrap;pointer-events:none}
.tsw .nut{position:absolute;left:50%;top:34px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0eef4,#9a96a2 55%,#55515c);box-shadow:0 0 0 1.5px #15121a}
.tsw .bat{position:absolute;left:50%;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(90deg,#8c8896,#f4f2f8 45%,#a4a0ac);box-shadow:0 0 0 1px #15121a;transition:top .07s,height .07s}
.tsw.on .bat{top:16px;height:18px}.tsw:not(.on) .bat{top:34px;height:15px;filter:brightness(.8)}
.tsw em{position:absolute;left:0;right:0;bottom:3px;font:normal 8px/1 var(--mono);text-align:center;color:#a49cae;pointer-events:none}
.tsw em.u{display:none}.tsw.on em.u{display:block;color:#8fe08a}.tsw.on em.d{display:none}
.tsw.warn{animation:warnb .6s infinite}@keyframes warnb{50%{background:#7a5c18}}
#flapL{width:42px;cursor:ns-resize;touch-action:none}
#flapL .fslot{position:absolute;left:11px;top:16px;bottom:8px;width:4px;background:#0d0b10}
#flapL .fd{position:absolute;right:5px;font:9px/1 var(--mono);color:#7b7385;transform:translateY(-50%);pointer-events:none}
#flapL .fd.on{color:#ffd36b}
#flapH{position:absolute;left:3px;width:20px;height:9px;transform:translateY(-50%);transition:top .12s;pointer-events:none;
  background:linear-gradient(#ffffff,#d8d2c8);clip-path:polygon(0 30%,20% 0,100% 35%,100% 65%,20% 100%,0 70%);filter:drop-shadow(0 1px 0 #000)}
#brake{width:46px;height:64px;touch-action:none;background:linear-gradient(to top, rgba(140,40,32,.9) var(--b,0%), rgba(28,24,34,.78) var(--b,0%))}
#brake .ped{position:absolute;left:8px;right:8px;top:17px;bottom:7px;border-radius:3px;background:repeating-linear-gradient(#5a5560 0 3px,#2a2630 3px 6px);box-shadow:0 0 0 1.5px #15121a}
#brake.on .ped{background:repeating-linear-gradient(#e5483b 0 3px,#8a2a22 3px 6px)}
#check{position:fixed;left:calc(var(--sl) + 240px);top:calc(var(--st) + 50px);background:var(--glass);border:2px solid var(--line);padding:6px 9px;font-family:var(--mono);font-size:14px;line-height:1.6;pointer-events:none;z-index:2}
#check b{display:block;font-size:9px;opacity:.75;letter-spacing:.06em}
@media (max-height:520px){#pcol{flex-direction:row;align-items:flex-start;width:auto}#check{left:calc(var(--sl) + 116px);top:calc(var(--st) + 186px);font-size:12px;line-height:1.45;padding:4px 7px}}
#check .ok{color:#8fe08a}
#fps{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 46px);white-space:nowrap;background:var(--glass);color:var(--paper);font-family:var(--mono);font-size:13px;padding:3px 6px;pointer-events:none;z-index:1}
/* accessories: a column of small switches down the right edge, with the air-drop buttons beside it when needed */
#rcol{position:fixed;right:var(--sr);top:calc(var(--st) + 50px);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:6px;z-index:3}
#fun{display:flex;flex-direction:column;gap:5px}
.tsw.red .bat{background:linear-gradient(90deg,#8a1e18,#ff6a5a 45%,#a4281f)}.tsw.red.on em.u{color:#ff9a6a}
#micBtn .grille{position:absolute;left:9px;right:9px;top:15px;height:26px;border-radius:5px;background:repeating-radial-gradient(circle at 50% 50%,#55505c 0 1.2px,#141118 1.2px 3px);box-shadow:0 0 0 1.5px #0b090d,0 2px 0 #000}
#micBtn:active .grille{transform:translateY(2px);box-shadow:0 0 0 1.5px #0b090d}
#micBtn.talk{animation:talkb .5s infinite}@keyframes talkb{50%{background:rgba(70,110,60,.9)}}
#micBtn em{position:absolute;left:0;right:0;bottom:3px;font:normal 8px/1 var(--mono);color:#ffd36b;text-align:center}
#dropUI{display:flex;flex-direction:column;gap:6px}
#dropUI button{font-family:var(--mono);font-size:14px;line-height:1.1;padding:8px 10px;min-width:62px}
#lookBtn.on{background:var(--good);color:#fff;box-shadow:inset -3px -3px 0 #3e7334, 0 3px 0 #0007}
#dropBtn{background:#e2703f;color:#fff8ec;box-shadow:inset -3px -3px 0 #b5512b, 0 3px 0 #0007}#dropBtn.empty{opacity:.55}
#stick{position:fixed;left:42%;right:0;top:calc(var(--st) + 50px);bottom:0;touch-action:none}
#ring{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border:2px dashed #f5e8cf99;border-radius:50%;pointer-events:none}
#ring.idle{opacity:.55}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;background:var(--paper);border-radius:50%;box-shadow:0 3px 0 #0008}
#ringHint{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);font-family:var(--mono);font-size:13px;white-space:nowrap;color:var(--paper);opacity:.8}

/* overlays */
#chartOv{position:fixed;inset:0;z-index:28;background:#1e4878;border:3px solid #fff8ec;box-sizing:border-box}
#chartOv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#chartLeg{position:absolute;left:calc(var(--sl) + 4px);top:calc(var(--st) + 2px);font-family:var(--mono);font-size:12px;line-height:1.15;color:var(--paper);background:rgba(20,34,58,.6);padding:3px 6px;max-width:42%;pointer-events:none}
#chartLeg b{color:#ffd36b;letter-spacing:.06em}
#chartLeg{animation:legfade .8s 4s forwards}@keyframes legfade{to{opacity:0}}
#chartX{position:absolute;right:calc(var(--sr) + 2px);top:calc(var(--st) + 2px);width:36px;height:36px;padding:0;font-size:18px;line-height:1;background:var(--paper);color:var(--ink)}
.who{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.who img{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--ink);flex:none}
.px-img{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.who b{display:block;font-size:22px;line-height:1.05;font-weight:700}
.who span{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:.05em}
.say{font-size:18px!important;line-height:1.35}
.got{font-family:var(--mono);font-size:15px;color:var(--ink2);margin:6px 0 4px}
.page h4{font-family:var(--mono);font-size:15px;letter-spacing:.06em;color:var(--ink2);margin:10px 0 4px}
.page ul{margin:0 0 10px;padding-left:20px;font-size:15px;line-height:1.4}
.page table{border-collapse:collapse;font-size:14px;margin:4px 0 12px;width:100%}
.page td{color:var(--ink);border-top:2px dashed var(--paper2);padding:6px 6px 6px 0;vertical-align:top}
.page td:first-child{font-family:var(--mono);font-size:15px;white-space:nowrap;color:var(--ink2)}
#bigmap{width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--ink);display:block;margin:4px 0 10px;background:#1d2a44}
.card.wide{width:min(760px,100%)}
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) var(--sr) calc(12px + env(safe-area-inset-bottom,0px)) var(--sl);background:rgba(28,22,38,.35);overflow:auto}
.card{background:var(--paper) var(--paperTex);background-size:192px 192px;image-rendering:auto;color:var(--ink);width:min(520px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-shadow:6px 6px 0 #000a,inset 0 0 10px rgba(110,62,18,.38),inset 0 0 34px rgba(130,82,30,.26),inset 0 0 80px rgba(150,105,45,.14);border:3px solid var(--ink);box-sizing:border-box}
.card .topbar{display:flex;gap:8px;margin:-6px 0 10px;position:sticky;top:-18px;z-index:2;background:var(--paper);padding:6px 0 4px}
.card .backbtn{font-family:var(--mono);font-size:17px;padding:6px 12px}
.card h2{margin:0 0 4px;font-size:26px;line-height:1.05;font-weight:700;text-wrap:balance}
.card .sub{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--ink2);margin-bottom:12px}
.card p{margin:0 0 10px;font-size:16px;line-height:1.35}
.rows{color:var(--ink);display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:baseline;margin:6px 0 14px;font-size:16px}
.rows .k{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:.05em}
.rows .s{color:#c9842a;letter-spacing:2px;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btns button{font-size:15px}
/* card buttons are tinted so they stand out from the paper card; the orange one is the main action */
.card .btns button:not(.primary){background:var(--bc,#d6e4ec);border:2px solid #241c2e33;box-shadow:inset -3px -3px 0 #0000001f,0 3px 0 #0007}
.card .btns.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.card .btns.grid{grid-template-columns:repeat(2,1fr)}}
.card .btns.grid button{min-height:52px;font-size:16px;text-align:center;display:flex;align-items:center;justify-content:center;padding:6px 8px;color:var(--ink)}
#title{background:linear-gradient(180deg,rgba(28,22,38,.0) 30%,rgba(28,22,38,.55));place-items:end start;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#title .wrap{max-width:560px}
#title h1{margin:0;font-family:var(--fancy);font-size:54px;line-height:.9;color:var(--paper);text-shadow:4px 4px 0 var(--ink);font-weight:400}
@media (min-width:700px) and (min-height:420px){#title h1{font-size:81px}}
#title .tag{font-family:var(--mono);font-size:15px;letter-spacing:.06em;margin:8px 0 14px;text-shadow:2px 2px 0 var(--ink)}
.list{display:grid;gap:8px;margin:4px 0 12px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff6e4 var(--paperTex);background-size:192px 192px;border:2px solid var(--paper2);padding:8px 10px;text-align:left;width:100%;box-shadow:none;color:var(--ink)}
.item b{display:block;font-size:17px}
.item span.d{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.25}
.item .r{font-family:var(--mono);font-size:14px;white-space:nowrap;color:var(--ink2)}
.item.done{border-color:var(--good)}
.chk{font-family:var(--mono);font-size:17px;width:18px;text-align:center}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:2px dashed var(--paper2)}
.tog b{font-size:16px}.tog span{display:block;font-size:13px;color:var(--ink2)}
.tog button{font-family:var(--mono);font-size:15px;min-width:58px}
.tog button.on{background:var(--good);color:#fff;box-shadow:inset -3px -3px 0 #3e7334, 0 3px 0 #0007}
h3{font-family:var(--mono);font-size:15px;letter-spacing:.08em;color:var(--ink2);margin:12px 0 6px}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}

.num{font-family:'VT323',ui-monospace,monospace;font-size:1.22em;line-height:1;letter-spacing:.02em}
</style>

<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div id="flightUI" hidden>
  <div id="top">
    <div class="pill" id="spd">0<small>KT</small></div>
    <button id="dest" aria-label="Change destination"><span class="arr" id="arr">▲</span><span id="destTxt">—</span></button>
    <div class="sp"><button id="task" hidden aria-label="What to do next. Tap for the mail bag."></button></div>
    <div class="pill" id="alt">0<small>FT</small><span id="vsi"></span></div>
    <button id="center" aria-label="Recenter tilt" hidden>CENTER</button>
    <button id="radioBtn" aria-label="Radio station"></button>
    <button id="todBtn" aria-label="Time of day"></button>
    <button id="view" aria-label="Change view">CHASE</button>
    <button id="pause" aria-label="Pause">II</button>
  </div>
  <div id="stallBan" hidden>STALL</div>
  <div id="callout" hidden></div>
  <div id="thr" aria-label="Throttle lever"><b class="lab">THROTTLE</b><div id="thrSlot"></div><div id="thrTicks"></div><div id="thrKnob"></div><span id="thrPct">0%</span></div>
  <button id="updraft" aria-label="Updraft"></button>
  <button id="wind" aria-label="Tailwind boost"></button>
  <div id="rail">
    <button class="rb on" id="rMap" aria-label="Show or hide the map"></button>
    <button class="rb on" id="rJob" aria-label="Show or hide today's jobs"></button>
    <button class="rb on" id="rEng" aria-label="Show or hide the landing controls"></button>
    <button class="rb on" id="rFun" aria-label="Show or hide the light, smoke, float and radio switches"></button>
    <button class="rb" id="rChk" aria-label="Show or hide the before-landing checklist"></button>
    <button class="rb" id="rDrop" aria-label="Show or hide the air-drop controls" hidden></button>
  </div>
  <div id="pcol"><canvas id="mapc" width="96" height="96" aria-label="Map. Tap for the full chart."></canvas>
    <div id="job" aria-label="Today's jobs. Tap for the mail bag."><div class="jh"><span id="jDay">FREE FLIGHT</span><span id="score" aria-label="Score">★ 0</span></div><div id="bag" hidden></div><div id="jDrop" hidden></div><div id="errand" hidden></div></div></div>
  <div id="eng">
    <button id="brake"><b class="lab">BRAKE</b><span class="ped"></span></button>
    <div id="flapL" aria-label="Flap lever"><b class="lab">FLAPS</b><div class="fslot"></div><span class="fd" data-f="0">0</span><span class="fd" data-f="1">1</span><span class="fd" data-f="2">2</span><div id="flapH"></div></div>
    <button class="tsw" id="swCarb"><b class="lab">CARB HT</b><span class="nut"></span><span class="bat"></span><em class="u">ON</em><em class="d">OFF</em></button>
    <button class="tsw" id="swMix"><b class="lab">MIX</b><span class="nut"></span><span class="bat"></span><em class="u">RICH</em><em class="d">LEAN</em></button>
    <button class="tsw" id="swLight"><b class="lab">LAND LT</b><span class="nut"></span><span class="bat"></span><em class="u">ON</em><em class="d">OFF</em></button>
  </div>
  <div id="check" hidden></div>
  <div id="rcol">
    <div id="fun">
      <button class="tsw" id="swSearch"><b class="lab">SEARCH LT</b><span class="nut"></span><span class="bat"></span><em class="u">ON</em><em class="d">OFF</em></button>
      <button class="tsw" id="swSmoke"><b class="lab">SMOKE</b><span class="nut"></span><span class="bat"></span><em class="u">ON</em><em class="d">OFF</em></button>
      <button class="tsw red" id="swFloat"><b class="lab">FLOATS</b><span class="nut"></span><span class="bat"></span><em class="u">OUT</em><em class="d">PULL</em></button>
      <button id="micBtn" aria-label="Key the radio mic"><b class="lab">MIC</b><span class="grille"></span><em>○○○</em></button>
      <button id="hornBtn" aria-label="Honk the horn"><b class="lab">HORN</b><span class="bell"></span></button>
    </div>
    <div id="dropUI" hidden><button id="lookBtn" aria-label="Look straight down">LOOK<br>DOWN</button><button id="dropBtn" aria-label="Drop a parcel">DROP</button></div>
  </div>
  <div id="stick"><div id="ring" class="idle"><div id="knob"></div><div id="ringHint">STICK · DRAG ANYWHERE</div></div></div>
</div>
<div id="toast" hidden></div>
<div id="fps" hidden></div>

<div id="title" class="ov">
  <div class="wrap">
    <h1>Saltwhistle Skies</h1>
    <div class="tag">AIR MAIL FOR THE SALTWHISTLE ISLANDS · ONE LITTLE PLANE</div>
    <div class="btns">
      <button class="primary" id="tFly">Start the day at Harbor Field</button>
      <button id="tStart">Start at a field</button>
    </div>
  </div>
</div>
<div id="modal" class="ov" hidden><div class="card" id="cardBody"></div></div>
<div id="rotate" class="ov" hidden><div class="card"><h2>Turn your phone sideways</h2><p>The island fits best in landscape.</p><div class="btns"><button id="rotOk">Play anyway</button></div></div></div>
