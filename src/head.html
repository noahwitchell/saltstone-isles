<title>Saltwhistle Skies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: full-bleed pixel render; flight data along the top edge, throttle under the left thumb, stick zone under the right thumb; paper-card overlays for menus. One committed dusk-arcade look. */
:root{
  --ink:#241c2e; --ink2:#4a3d55; --paper:#f5e8cf; --paper2:#e3cda4; --accent:#e2703f; --accent2:#b5512b;
  --good:#5c9e4f; --warn:#f1c84a; --bad:#e5483b; --glass:rgba(36,28,46,.74); --line:#5a4a63;
  --display:'Pixelify Sans','Silkscreen',ui-monospace,monospace; --fancy:'Jacquarda Bastarda 9','Pixelify Sans',serif; --mono:'Silkscreen',ui-monospace,monospace;
  --sl:max(10px, env(safe-area-inset-left, 0px)); --sr:max(10px, env(safe-area-inset-right, 0px));
  --st:calc(6px + env(safe-area-inset-top, 0px)); --sb:calc(8px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#1f1a2b;color:var(--paper);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--display)}
#gl,#hud{position:fixed;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated}
#hud{pointer-events:none}
button{font:inherit;color:var(--ink);background:var(--paper);border:0;border-radius:0;padding:8px 12px;cursor:pointer;touch-action:manipulation;
  box-shadow:inset -3px -3px 0 var(--paper2), 0 3px 0 #0007}
button:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 var(--paper2), 0 1px 0 #0007}
button.primary{background:var(--accent);color:#fff8ec;box-shadow:inset -3px -3px 0 var(--accent2), 0 3px 0 #0007}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* flight HUD */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:var(--st) var(--sr) 0 var(--sl);pointer-events:none}
.pill{pointer-events:auto;font-family:var(--mono);font-size:15px;line-height:1;background:var(--glass);color:var(--paper);padding:7px 9px;border:2px solid var(--line);
  box-shadow:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:9px;opacity:.75;margin-left:3px}
#spd.warn{background:var(--bad);border-color:#ffb0a0}
.pill.ok{background:rgba(52,110,48,.85);border-color:#8fe08a}.pill.caution{background:rgba(170,120,30,.9);border-color:#f1c84a}
#vsi.ok{color:#8fe08a}#vsi.caution{color:#f1c84a}#vsi.bad{color:#ff8a7a}
#callout{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:30px;color:var(--paper);text-shadow:3px 3px 0 var(--ink);pointer-events:none}
#vsi{font-size:10px;margin-left:6px;opacity:.9}
#dest{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:8px 10px;color:var(--paper);background:var(--glass);border:2px solid var(--line);box-shadow:none}
#dest .arr{display:inline-block;width:12px;text-align:center;color:#6fe0e0;margin-right:4px}
.sp{flex:1}
#view,#pause,#center{pointer-events:auto;font-family:var(--mono);font-size:11px;padding:8px 10px}
#stallBan{position:fixed;left:50%;top:calc(var(--st) + 44px);transform:translateX(-50%);font-family:var(--mono);font-size:14px;background:var(--bad);color:#fff;padding:5px 12px;letter-spacing:.1em;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(var(--st) + 46px);transform:translateX(-50%);max-width:min(560px,74vw);background:var(--paper);color:var(--ink);padding:9px 13px;font-size:15px;line-height:1.3;
  box-shadow:4px 4px 0 #0008;pointer-events:none;text-align:center;text-wrap:balance}
#toast.up{top:calc(var(--st) + 80px)}

/* controls */
#thr{position:fixed;left:var(--sl);top:calc(var(--st) + 50px);bottom:var(--sb);width:58px;background:var(--glass);border:2px solid var(--line);touch-action:none}
#thrFill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#e2703f,#b5512b);opacity:.55}
#thrKnob{position:absolute;left:-4px;right:-4px;height:14px;background:var(--paper);box-shadow:0 3px 0 #0008;transform:translateY(50%)}
#thr span{position:absolute;left:0;right:0;top:6px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--paper)}
#thrPct{top:auto!important;bottom:6px}
#lcol{position:fixed;left:calc(var(--sl) + 68px);top:calc(var(--st) + 50px);width:124px;display:flex;flex-direction:column;gap:6px}
#mapc{width:124px;height:124px;image-rendering:pixelated;border:2px solid var(--line);background:#1d2a44;display:block;box-sizing:border-box;cursor:pointer}
#sw{display:flex;gap:4px}
#sw button{flex:1;font-family:var(--mono);font-size:9px;padding:7px 0;line-height:1.1;background:#3a3344;color:var(--paper);box-shadow:inset -2px -2px 0 #241c2e, 0 2px 0 #0007}
#sw button.on{background:var(--good);color:#fff;box-shadow:inset -2px -2px 0 #3e7334, 0 2px 0 #0007}
#sw button.warn{background:var(--warn);color:var(--ink)}
#lbtn{position:fixed;left:calc(var(--sl) + 68px);bottom:var(--sb);display:flex;gap:6px;width:124px}
#lbtn button{flex:1;font-family:var(--mono);font-size:10px;padding:11px 0;position:relative;overflow:hidden}
#brake{background:linear-gradient(to top, var(--bad) var(--b,0%), var(--paper) var(--b,0%))}
#brake.on{color:#fff}
#check{position:fixed;left:calc(var(--sl) + 200px);top:calc(var(--st) + 50px);background:var(--glass);border:2px solid var(--line);padding:6px 9px;font-family:var(--mono);font-size:10px;line-height:1.6;pointer-events:none}
#check b{display:block;font-size:9px;opacity:.75;letter-spacing:.06em}
#check .ok{color:#8fe08a}
#bag{position:fixed;right:var(--sr);top:calc(var(--st) + 50px);background:var(--glass);border:2px solid var(--line);padding:5px 8px;font-family:var(--mono);font-size:10px;pointer-events:none}
#stick{position:fixed;left:42%;right:0;top:calc(var(--st) + 50px);bottom:0;touch-action:none}
#ring{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border:2px dashed #f5e8cf99;border-radius:50%;pointer-events:none}
#ring.idle{opacity:.55}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;background:var(--paper);border-radius:50%;box-shadow:0 3px 0 #0008}
#ringHint{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);font-family:var(--mono);font-size:9px;white-space:nowrap;color:var(--paper);opacity:.8}

/* overlays */
.who{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.who img{width:96px;height:96px;image-rendering:pixelated;border:3px solid var(--ink);flex:none}
.px-img{image-rendering:pixelated;display:block;max-width:100%;height:auto}
.who b{display:block;font-size:22px;line-height:1.05;font-weight:700}
.who span{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.05em}
.say{font-size:18px!important;line-height:1.35}
.got{font-family:var(--mono);font-size:11px;color:var(--ink2);margin:6px 0 4px}
.page h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink2);margin:10px 0 4px}
.page ul{margin:0 0 10px;padding-left:20px;font-size:15px;line-height:1.4}
.page table{border-collapse:collapse;font-size:14px;margin:4px 0 12px;width:100%}
.page td{border-top:2px dashed var(--paper2);padding:6px 6px 6px 0;vertical-align:top}
.page td:first-child{font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--ink2)}
#bigmap{width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--ink);display:block;margin:4px 0 10px;background:#1d2a44}
.card.wide{width:min(760px,100%)}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) var(--sr) calc(12px + env(safe-area-inset-bottom,0px)) var(--sl);background:rgba(28,22,38,.35);overflow:auto}
.card{background:var(--paper);color:var(--ink);width:min(520px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-shadow:6px 6px 0 #000a;border:3px solid var(--ink);box-sizing:border-box}
.card h2{margin:0 0 4px;font-size:26px;line-height:1.05;font-weight:700;text-wrap:balance}
.card .sub{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink2);margin-bottom:12px}
.card p{margin:0 0 10px;font-size:16px;line-height:1.35}
.rows{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:baseline;margin:6px 0 14px;font-size:16px}
.rows .k{font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.05em}
.rows .s{color:#c9842a;letter-spacing:2px;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btns button{font-size:15px}
#title{background:linear-gradient(180deg,rgba(28,22,38,.0) 30%,rgba(28,22,38,.55));place-items:end start;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#title .wrap{max-width:560px}
#title h1{margin:0;font-family:var(--fancy);font-size:54px;line-height:.9;color:var(--paper);text-shadow:4px 4px 0 var(--ink);font-weight:400}
@media (min-width:700px) and (min-height:420px){#title h1{font-size:81px}}
#title .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;margin:8px 0 14px;text-shadow:2px 2px 0 var(--ink)}
.list{display:grid;gap:8px;margin:4px 0 12px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff6e4;border:2px solid var(--paper2);padding:8px 10px;text-align:left;width:100%;box-shadow:none;color:var(--ink)}
.item b{display:block;font-size:17px}
.item span.d{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.25}
.item .r{font-family:var(--mono);font-size:10px;white-space:nowrap;color:var(--ink2)}
.item.done{border-color:var(--good)}
.chk{font-family:var(--mono);font-size:12px;width:18px;text-align:center}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:2px dashed var(--paper2)}
.tog b{font-size:16px}.tog span{display:block;font-size:13px;color:var(--ink2)}
.tog button{font-family:var(--mono);font-size:11px;min-width:58px}
.tog button.on{background:var(--good);color:#fff;box-shadow:inset -3px -3px 0 #3e7334, 0 3px 0 #0007}
h3{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink2);margin:12px 0 6px}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}
</style>

<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div id="flightUI" hidden>
  <div id="top">
    <div class="pill" id="spd">0<small>KT</small></div>
    <button id="dest" aria-label="Change destination"><span class="arr" id="arr">▲</span><span id="destTxt">—</span></button>
    <div class="sp"></div>
    <div class="pill" id="alt">0<small>FT</small><span id="vsi"></span></div>
    <button id="center" aria-label="Recenter tilt" hidden>CENTER</button>
    <button id="view" aria-label="Change view">CHASE</button>
    <button id="pause" aria-label="Pause">II</button>
  </div>
  <div id="stallBan" hidden>STALL</div>
  <div id="callout" hidden></div>
  <div id="thr" aria-label="Throttle"><div id="thrFill"></div><div id="thrKnob"></div><span>PWR</span><span id="thrPct">0%</span></div>
  <div id="lcol"><canvas id="mapc" width="96" height="96" aria-label="Map. Tap for the full chart."></canvas>
    <div id="sw"><button id="swCarb">CARB<br>HEAT</button><button id="swMix">MIX<br>RICH</button><button id="swLight">LAND<br>LIGHT</button></div></div>
  <div id="lbtn"><button id="flaps">FLAPS 0</button><button id="brake">BRAKE</button></div>
  <div id="check" hidden></div>
  <div id="bag" hidden></div>
  <div id="stick"><div id="ring" class="idle"><div id="knob"></div><div id="ringHint">STICK · DRAG ANYWHERE</div></div></div>
</div>
<div id="toast" hidden></div>

<div id="title" class="ov">
  <div class="wrap">
    <h1>Saltwhistle Skies</h1>
    <div class="tag">AIR MAIL FOR THE SALTWHISTLE ISLANDS · ONE LITTLE PLANE</div>
    <div class="btns">
      <button class="primary" id="tFly">Start the day at Harbor Field</button>
      <button id="tPractice">Practice a landing</button>
      <button id="tStart">Start somewhere else</button>
      <button id="tBea">Bea's logbook</button>
      <button id="tLog">Your logbook</button>
      <button id="tSet">Settings</button>
    </div>
  </div>
</div>
<div id="modal" class="ov" hidden><div class="card" id="cardBody"></div></div>
<div id="rotate" class="ov" hidden><div class="card"><h2>Turn your phone sideways</h2><p>The island fits best in landscape.</p><div class="btns"><button id="rotOk">Play anyway</button></div></div></div>
